:root{--bg:#0F1020;--sf:#1A1C33;--sf2:#22244A;--tx:#F2F0FF;--sub:#A9A6C8;--acc:#FF7A1A;--accd:#C25300;--acc2:#4CC9F0;--line:#2C2E4D;--ok:#3DDC97;--okbg:#10322A;--bad:#FF6B6B;--badbg:#3A1A22;--flame:#FFB347}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Space Grotesk',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
a{color:var(--acc2)}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 6px}
.logo{font-size:24px;font-weight:700}.logo span{color:var(--acc)}
.stats{display:flex;gap:14px;font-weight:700}
.stat{display:flex;gap:4px;align-items:center}
.hero{margin:8px 20px 0;position:relative;min-height:168px;border-radius:22px;background:radial-gradient(circle at 25% 60%,rgba(255,122,26,.35),transparent 60%),var(--sf);border:1px solid var(--line);overflow:hidden;display:flex;align-items:center;gap:6px;padding:10px 14px 10px 4px}
.hero .g{width:140px;flex-shrink:0}
#galvo .g{width:140px}
.hero .msg{flex:1}
.lvl{font-size:12px;color:var(--sub);letter-spacing:.08em;font-weight:600}
.say{font-size:18px;font-weight:700;line-height:1.3;margin-top:4px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .5s}
.small{font-size:12px;color:var(--sub);margin-top:4px}
.sec{padding:20px 20px 8px;font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.1em}
.main{flex:1;overflow-y:auto;padding-bottom:90px}
.unit{margin:6px 20px 14px;border-radius:18px;border:1px solid var(--line);background:var(--sf);overflow:hidden}
.unit h3{margin:0;font-size:18px}
.uh{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.uh .s{font-size:13px;color:var(--sub);margin-top:2px}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;background:var(--sf2);color:var(--sub);white-space:nowrap}
.steps{display:flex;flex-direction:column;gap:10px;padding:0 16px 16px}
.step{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:transparent;border:0;padding:0}
.dot{width:22px;height:22px;border-radius:50%;flex-shrink:0}
.dot.d{background:var(--acc);box-shadow:0 0 12px var(--acc)}
.dot.c{border:4px solid var(--acc2);box-shadow:0 0 16px var(--acc2);background:var(--bg)}
.dot.l{background:var(--line)}
.card{flex:1;background:var(--sf2);border:1px solid var(--line);border-radius:14px;padding:11px 14px;min-height:48px}
.card.c{border-color:var(--acc2);box-shadow:0 0 22px rgba(76,201,240,.22)}
.card b{display:block;font-size:15px}
.card span{font-size:12px;color:var(--sub)}
.card.c span{color:var(--acc2)}
.step:disabled .card b{color:var(--sub)}
.step:disabled{cursor:default}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:var(--sf);border-top:1px solid var(--line);padding:4px 6px calc(10px + env(safe-area-inset-bottom));z-index:5}
.nav button{flex:1;height:56px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;color:var(--sub)}
.nav button.on{color:var(--acc)}
.nav svg{width:24px;height:24px}
.btn{width:100%;height:54px;border-radius:16px;border:0;background:var(--acc);color:#1A0D00;font-size:17px;font-weight:700;box-shadow:0 5px 0 var(--accd)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--accd)}
.btn:disabled{background:var(--line);color:var(--sub);box-shadow:none}
.btn.ghost{background:var(--sf2);color:var(--tx);box-shadow:0 5px 0 #0A0B18;border:1px solid var(--line)}
.btn.ok{background:var(--ok);color:#06251A;box-shadow:0 5px 0 #1E8F5F}
.btn.bad{background:var(--bad);color:#2A0A0A;box-shadow:0 5px 0 #B23A3A}
/* lesson */
.lt{display:flex;align-items:center;gap:12px;padding:18px 20px 0}
.x{width:44px;height:44px;border-radius:12px;border:0;background:transparent;font-size:28px;color:var(--sub);line-height:1}
.prog{flex:1;height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.prog>i{display:block;height:100%;background:var(--acc);border-radius:7px;transition:width .35s}
.combo{font-weight:700;color:var(--flame);min-width:40px;text-align:right}
.qwrap{flex:1;display:flex;flex-direction:column;padding:18px 20px 0}
.qhead{display:flex;gap:10px;align-items:flex-start}
.qhead>div:nth-child(2){flex:1;min-width:0}
.qtext,.opt,.mi,.chip,.fillq,.ctx,.ib,.sheet p,.lcard,.row{overflow-wrap:anywhere}
.qtext,.opt,.mi{hyphens:auto;-webkit-hyphens:auto;hyphenate-limit-chars:13 5 5}
.g .eye{transform-box:fill-box;transform-origin:center;animation:blink 5.5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}96%{transform:scaleY(1)}}
.g .beam{animation:beamf 2.8s ease-in-out infinite}
@keyframes beamf{50%{opacity:.55}}
.ib{position:relative;margin:10px 0 0 22px;align-self:flex-start;background:#F2F0FF;color:#14152A;font-weight:700;font-size:14px;padding:8px 12px;border-radius:14px;max-width:290px;animation:pop .35s}
.ib:before{content:'';position:absolute;left:18px;top:-7px;border:7px solid transparent;border-top:0;border-bottom-color:#F2F0FF}
.bkin{width:100%;margin-top:12px;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.gsay{margin:2px 0 8px;font-size:14px;font-style:italic;opacity:.92}.gsay b{font-style:normal}
.spk{flex:0 0 auto;width:40px;height:40px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.spk.on{background:rgba(76,201,240,.22);border-color:#4CC9F0;animation:spkp 1s ease-in-out infinite}
@keyframes spkp{50%{transform:scale(1.08)}}
.rates{display:flex;gap:6px;margin-top:8px}.rates button{flex:1;padding:8px 0;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:transparent;color:var(--sub);font-weight:700;font-family:inherit}.rates button.on{background:rgba(76,201,240,.18);color:#fff;border-color:#4CC9F0}
.qhead .g{width:84px;flex-shrink:0}
.qtag{font-size:12px;font-weight:700;color:var(--acc2);letter-spacing:.08em}
.qtext{font-size:20px;font-weight:700;line-height:1.3;margin-top:4px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;min-height:56px;padding:10px 16px;border-radius:16px;border:1px solid var(--line);background:var(--sf);font-size:16px;font-weight:600}
.opt.sel{border-color:var(--acc2);box-shadow:0 0 16px rgba(76,201,240,.3);background:#13233A}
.opt.right{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.opt .k{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;color:var(--sub)}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.tf .opt{justify-content:center;font-size:18px;min-height:72px}
.ord-ans{min-height:64px;border:1px dashed var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;margin-top:16px}
.ord-ans .ph{color:var(--sub);font-size:14px;text-align:center;padding:10px}
.chip{display:flex;gap:10px;align-items:center;text-align:left;padding:10px 14px;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--sf);font-size:15px;font-weight:600}
.chip .n{width:24px;height:24px;border-radius:50%;background:var(--acc);color:#1A0D00;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.ord-pool{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.chip.used{opacity:.25}
.foot{padding:16px 20px 24px;position:sticky;bottom:0;z-index:5;background:linear-gradient(180deg,rgba(15,16,32,0),var(--bg) 26%)}
.sheet{padding:18px 20px 24px;display:flex;flex-direction:column;gap:10px;animation:up .25s ease-out}
.sheet.ok{background:var(--okbg)}.sheet.bad{background:var(--badbg)}
.sheet h4{margin:0;font-size:22px;display:flex;gap:8px;align-items:center}
.sheet.ok h4{color:var(--ok)}.sheet.bad h4{color:var(--bad)}
.sheet p{margin:0;font-size:15px;line-height:1.45}
.sheet .src{font-size:12px;color:var(--sub)}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.bob{animation:bob 2.4s ease-in-out infinite}
.shake{animation:shake .3s}

.gl span{font-size:14px;color:var(--sub);line-height:1.45}
.back{border:0;background:transparent;color:var(--sub);font-size:15px;font-weight:700;padding:18px 20px 0;display:flex;gap:6px;align-items:center;min-height:44px}

.srs{margin:14px 20px 0;padding:14px 16px;border-radius:18px;border:1px solid var(--acc2);background:rgba(76,201,240,.08);display:flex;gap:12px;align-items:center}

{ id:"sik", title:"Sikkerhed først", sub:"Laser, el og valser", color:"#E03131", qs:[

 {id:"sik2",t:"tf",q:"Det er i orden at kortslutte lågets sikkerhedsafbryder på en lukket laser for at se strålen under fejlfinding.",v:false,w:"Aldrig. Sikkerhedsafbryderen (interlock) beskytter øjnene. En lukket lasermaskine er kun sikker, når låget er lukket.",src:"fire"},
 {id:"sik3",t:"mc",q:"Hvilke laserbriller skal du bruge, når der arbejdes med åben laser?",a:["Briller godkendt til netop den lasers bølgelængde","Solbriller med UV-filter","Almindelige sikkerhedsbriller uden laserangivelse","Ingen – man kigger bare væk"],w:"Laserbriller er lavet til bestemte bølgelængder. Briller til en blå diode beskytter ikke nødvendigvis mod infrarød laser.",src:"od"},
 {id:"sik4",t:"tf",q:"Man må godt skære PVC i en laser, bare udsugningen er god.",v:false,w:"PVC afgiver hydrogenchlorid (saltsyredampe), som er farlig og tærer maskinen og udsugningen – god udsugning udskyder kun skaden. Meget 'vinyl' er PVC.",src:"pvc"},
 {id:"sik5",t:"mc",q:"Hvorfor må en laser aldrig køre uden opsyn?",a:["Materialet kan bryde i brand", "Linsen kan komme ud af fokus undervejs", "Forbindelsen til computeren kan ryge", "Strålen kan skifte bølgelængde"],w:"Træ og akryl kan antænde. Hav altid nogen ved maskinen og en brandslukker i nærheden.",src:"fire"},
 {id:"sik6",t:"mc",q:"Hvilken fare skal du især passe på ved en laminators valser?",a:["Fingre og tøj kan trækkes ind mellem valserne", "Valserne afgiver giftige dampe, når de bliver varme", "Valserne kan give elektrisk stød ved berøring", "Støjen fra valserne kan skade hørelsen"],w:"Valserne kan trække fingre, tøj og smykker ind. Brug skærme, fodpedal og nødstop, og undgå løst tøj og smykker.",src:"drytacjm"},
 {id:"sik7",t:"order",q:"Sæt trinene i rækkefølge, når du afslutter en service:",s:["Montér alle skærme og dæksler","Test at nødstop og sikkerhedsafbrydere virker","Kør et testjob","Aflever maskinen til kunden"],w:"Sikkerheden skal være på plads og testet, før maskinen kører og afleveres.",src:"oshaguard"},
 {id:"sik8",t:"tf",q:"UV-blæk kan irritere huden, så du bør bruge nitrilhandsker.",v:true,w:"Uhærdet UV-blæk kan give hudirritation og allergi. Brug handsker og evt. beskyttelsesbriller.",src:"hsep40"}
]},
{ id:"las", title:"Lasergravering", sub:"Galvos hjemmebane", color:"#E85D04", qs:[

 {id:"las2",t:"mc",q:"En blå diodelaser har svært ved…",a:["Klar akryl og blankt, ubehandlet metal", "Mørkt, ubehandlet træ og krydsfiner", "Sort læder og mørkt karton", "Malet eller anodiseret aluminium"],w:"Klar akryl optager næsten ikke blåt lys omkring 455 nm, så strålen går lige igennem. Blankt metal kan normalt heller ikke graveres direkte med en blå diode – belagt eller anodiseret metal kan.",src:"diode"},
 {id:"las3",t:"mc",q:"Hvilken laser egner sig bedst til at mærke metal?",a:["Infrarød / fiberlaser (ca. 1064 nm)", "Blå diodelaser (ca. 450 nm)", "CO₂-laser (10,6 µm) uden mærkningsspray", "UV-LED-lampen fra en UV-printer"],w:"Metal optager lys omkring 1064 nm godt, og fiberlaseren samler strålen i et meget lille punkt med høj intensitet. Blankt metal reflekterer derimod det meste af CO₂-laserens lys (10,6 µm).",src:["trotecfiber", "xtoolx1"]},
 {id:"las4",t:"mc",q:"Graveringen er bred, svag og uskarp. Hvad tjekker du først?",a:["Fokus og arbejdshøjde", "Luftfugtigheden i lokalet", "Om filen er gemt som RGB eller CMYK", "Strømkablets længde"],w:"Ude af fokus bliver strålen bredere og svagere. Mål højden igen eller kør autofokus.",src:"thunderpoor"},

 {id:"las6",t:"mc",q:"Hvad gør 'air assist'?",a:["Blæser røg og flammer væk og beskytter linsen", "Køler laserrøret, så det holder længere", "Suger emnet fast mod bordet, så det ligger plant", "Blæser luft ind i laserrøret, så strålen bliver kraftigere"],w:"Air assist giver renere snit, mindre forkulning og mindre snavs på optikken.",src:"airassist"},

 {id:"las8",t:"mc",q:"Der kommer brune røgrande omkring graveringen i træ. Hvad hjælper?",a:["Bedre udsugning/air assist og evt. maskeringstape", "Højere effekt, så røgen brænder helt væk", "Større afstand til fokus, så strålen bliver bredere", "Slukke for udsugningen, så røgen ikke trækkes hen over træet"],w:"Røgen sætter sig på overfladen. Fjern den hurtigere, eller beskyt overfladen med tape, der fjernes bagefter.",src:["trotecwood", "tromask"]},

 {id:"sto6",t:"mc",q:"Hvad bruger du til at rense caps og områder ved printhovedet?",a:["Den væske, producenten foreskriver til netop den blæktype", "Postevand på en fnugfri klud", "Almindelig husholdningssprit, fordi den fordamper hurtigt", "Glasrens, fordi den opløser indtørret blæk"],w:"Forkert væske kan skade printhovedet eller pakninger. Brug den væske, der passer til blækket.",src:["rolandmc", "epsoncap"]},

 {id:"lux7",t:"tf",q:"Latex-print er normalt tørre, når de kommer ud af printeren, og kan efterbehandles med det samme.",v:true,w:"Når blækket er hærdet korrekt i printeren, kommer latex-print tørre ud og kan lamineres med det samme – uden afgasning som ved eco-solvent.",src:"hplam"}

ILLU.lasergrid = (()=>{ const cols=["CO₂","Fiber","Diode","UV"], rows=[["Træ","y","n","y","y"],["Klar akryl","y","n","n","y"],["Glas","y","n","~","y"],["Blankt metal","n","y","~","~"]];
 const sym={y:['#3DDC97','✓'],n:['#FF6B6B','✕'],'~':['#FFB547','~']};
 let s=`<svg viewBox="0 0 300 170" role="img" aria-label="Oversigt: CO2 til træ, akryl og glas. Fiber til blankt metal. Diode til træ. UV til træ, klar akryl og glas.">`;
 cols.forEach((c,i)=>{ s+=`<text x="${130+i*44}" y="18" fill="#F2F0FF" font-size="11" font-weight="700" text-anchor="middle">${c}</text>`; });
 rows.forEach((r,j)=>{ const y=30+j*30; s+=`<rect x="6" y="${y}" width="288" height="26" rx="6" fill="${j%2?'#1A1C33':'#22244A'}"/><text x="14" y="${y+17}" fill="#F2F0FF" font-size="11">${r[0]}</text>`;
  r.slice(1).forEach((v,i)=>{ const [col,t]=sym[v]; s+=`<circle cx="${130+i*44}" cy="${y+13}" r="9" fill="${col}33"/><text x="${130+i*44}" y="${y+17}" fill="${col}" font-size="12" font-weight="700" text-anchor="middle">${t}</text>`; }); });
 s+=`<text x="150" y="162" fill="#A9A6C8" font-size="9.5" text-anchor="middle">~ = kun med belægning eller på visse materialer</text></svg>`; return s; })();

 {id:"ele6",t:"mc",q:"Hvornår skal din spændingstester afprøves ifølge HSE?",a:["Både før og efter hver kontrol","Kun én gang om året, når den kalibreres","Kun første gang, den tages i brug","Kun hvis den har været tabt på gulvet"],w:"Gå ikke ud fra, at instrumentet virker: afprøv det på en kendt spændingskilde eller en prøveenhed – før og efter kontrollen.",src:["hsg85","flukesafe"]},

 {id:"ele8",t:"mc",q:"Du har afbrudt strømmen til en strømforsyning med store kondensatorer. Hvad skal du sikre dig ifølge HSE?",a:["At oplagret ladning er afladet sikkert, før du rører delene","At kondensatorerne er varme, før du rører delene","At kondensatorerne er skiftet inden for det seneste år","At lågen har stået åben, så ladningen kan slippe ud i luften"],w:"Udstyr, der kan gemme ladning – fx kondensatorer – kan være farligt, selv om det er afbrudt. Ladningen skal være afladet sikkert.",src:"hsg85"},
 {id:"ele9",t:"mc",q:"Hvad gør du først, når du vil teste en sikring med multimeter efter Flukes metode?",a:["Afbryder strømmen og kobler kredsløbet fra strømkilden","Sætter multimeteret på ampere og måler med strøm på","Varmer sikringen op, så en revne i tråden bliver synlig","Skifter sikringen og ser, om den nye også springer"],w:"Fluke: kredsløbet skal være slukket og koblet fra strømkilden, og sikringen tages ud, før du måler.",src:"flukefuse"},
 {id:"ele10",t:"mc",q:"Hvilken indstilling foretrækker Fluke generelt til at teste en sikring?",a:["Gennemgangstest (continuity) – den bipper, når sikringen er hel","Strømmåling (ampere) – den viser, hvor meget sikringen tåler","Frekvensmåling (hertz) – den viser, om sikringen svinger","Temperaturmåling – den viser, om sikringen har været varm"],w:"Gennemgangstesten giver et tydeligt lydsignal, når der er forbindelse gennem sikringen. Modstandsmåling (ohm) kan også bruges.",src:"flukefuse"},
 {id:"ele11",t:"fill",s:"Viser multimeteret ___ i modstandsmåling hen over en sikring, er sikringen sprunget.",a:["OL","0 ohm","230 V","50 Hz"],w:"OL (eller '1' på nogle instrumenter) betyder uendelig modstand: der er ingen forbindelse gennem sikringen. En hel sikring viser 0 ohm eller tæt på.",src:"flukefuse"},
 {id:"ele12",t:"mc",q:"Hvordan tjekker du ifølge Fluke, at multimeteret virker, før du tester sikringen?",a:["Holder de to prober mod hinanden – i gennemgangstest skal det bippe","Måler i en stikkontakt med multimeteret sat til modstandsmåling","Ryster multimeteret let og ser, om displayet blinker","Skifter batteri – så ved du med sikkerhed, at det virker"],w:"Bipper det (eller viser ca. 0 ohm i modstandsmåling), virker instrument og ledninger. Først derefter tester du sikringen.",src:"flukefuse"},
 {id:"ele13",t:"tf",q:"Ser en sikring hel ud gennem glasset, er det ifølge Fluke unødvendigt at måle den.",v:false,w:"En sikring kan se hel ud og alligevel være defekt indeni. Mål den – og se også efter brudt tråd eller mørk, brændt farve.",src:"flukefuse"},
 {id:"ele14",t:"tf",q:"Fluke anbefaler at teste en ny sikring, før du sætter den i.",v:true,w:"Så undgår du at udskifte en sprunget sikring med en ny, der også er defekt.",src:"flukefuse"},
 {id:"ele15",t:"match",q:"Sæt målingen sammen med, hvad den fortæller (Fluke):",p:[["Bip i gennemgangstest hen over sikringen","Sikringen er hel"],["OL i modstandsmåling hen over sikringen","Sikringen er sprunget"],["Bip, når proberne holdes mod hinanden","Multimeteret virker"]],w:"Tjek altid instrumentet først – ellers ved du ikke, om et manglende bip skyldes sikringen eller multimeteret.",src:"flukefuse"},
 {id:"ele16",t:"mc",q:"Hvad dækker målekategorien CAT II på et multimeter ifølge Fluke?",a:["Enfasede belastninger, der er tilsluttet en stikkontakt","Trefaset fordeling, fx tavler og store motorer","Tilslutningen ved elmåleren og udendørs ledninger","Kun batteridrevet elektronik under 50 volt"],w:"CAT III er fordeling som tavler og trefasede motorer, CAT IV er tilslutningen ved forsyningen. Vælg et instrument til den højeste kategori, du kan komme til at måle i.",src:"flukesafe"},
 {id:"ele17",t:"mc",q:"Du opdager en revne i multimeterets kabinet og blotlagt metal på en prøveledning. Hvad siger Fluke?",a:["Brug aldrig et beskadiget multimeter eller beskadigede prober","Brug det kun til målinger under 230 volt","Sæt isolerbånd om, og mål videre som normalt","Brug det kun, når du har handsker på"],w:"Se instrument, prober og tilbehør efter for skader, før du måler – og tjek, at stikkene sidder fast.",src:"flukesafe"},
 {id:"ele18",t:"mc",q:"Hvad gør et ESD-armbånd ifølge ESD Association?",a:["Holder dig på jordpotentiale, så ladning ledes væk i stedet for at bygge sig op","Isolerer dig helt fra jord, så du ikke kan aflade til printkortet","Måler, hvor meget statisk elektricitet der er i lokalet lige nu","Beskytter dig mod stød fra netspænding, mens du arbejder i maskinen"],w:"Armbåndet har en modstand (oftest 1 megaohm), der begrænser strømmen. Det beskytter ikke mod netspænding – det må tværtimod ikke bruges, hvis du kan komme i berøring med kredsløb på 250 volt eller mere.",src:"esdapart3"},
 {id:"ele19",t:"tf",q:"Et ESD-armbånd bør ifølge ESD Association testes regelmæssigt – fx dagligt ved en teststation.",v:true,w:"ESD Association: test armbåndet regelmæssigt, enten dagligt ved en teststation eller med en kontinuerlig overvågning ved arbejdsbordet.",src:"esdapart3"},
 {id:"ele20",t:"mc",q:"Plastdele og andre isolatorer kan ikke aflades ved at blive jordet. Hvad bruger man så ifølge ESD Association?",a:["Ionisering, der neutraliserer ladningen med positive og negative ioner","Et ekstra ESD-armbånd, der sættes fast på selve plastdelen","En kraftig magnet, der trækker ladningen ud af plasten","Trykluft, der blæser ladningen af plastens overflade"],w:"Ionisering er et supplement – ikke en erstatning for jording af personer og ledende dele.",src:"esdapart3"},
 {id:"ele21",t:"mc",q:"I hvilken tilstand skal printeren være, når firmwaren opdateres via Roland DG Connect?",a:["Med den sekundære strøm (sub power) slukket","Midt i et printjob, så printhovedet er varmt","Med hovedafbryderen slukket og stikket trukket ud","Med frontlågen åben og mediet taget ud"],w:"Roland: klik på Update Firmware med printerens sekundære strøm slukket.",src:"rolandfw"},
 {id:"ele22",t:"mc",q:"Hvad skal blive ved med at køre på computeren, indtil Rolands firmwareopdatering er færdig?",a:["Roland DG Connect Hub","Et antivirusprogram","Printerens gamle driver","En skærmoptagelse"],w:"Roland: Connect Hub skal forblive aktiv, indtil opgraderingen er gennemført.",src:"rolandfw"},
 {id:"ele23",t:"mc",ctx:"Firmwareopdateringen via Roland DG Connect fejler midtvejs, fordi kundens netværk falder ud.",q:"Hvad anviser Roland?",a:["Opdatér fra Connect Hub eller fra den hentede fil med printerens IP-adresse","Sluk printeren på hovedafbryderen, og vent et døgn, før du prøver igen","Skift printerens bundkort, da firmwaren nu er ødelagt for altid","Geninstallér Windows på kundens computer, og start forfra"],w:"Roland: fejler opdateringen på grund af netværket, så opgradér fra Roland DG Connect Hub – eller brug den hentede firmwarefil, og angiv printerens IP-adresse.",src:"rolandfw"},
 {id:"ele24",t:"mc",ctx:"Midt i en firmwareopdatering på en Mimaki-plotter vil kunden trække USB-kablet ud for at flytte computeren.",q:"Hvad siger du?",a:["Vent – afbrydes strøm eller USB for tidligt, kan maskinen ende med ikke at kunne starte","Det er fint – opdateringen fortsætter af sig selv, når kablet bliver sat i igen","Det er fint, bare strømmen til selve plotteren ikke bliver afbrudt undervejs","Træk hellere strømstikket ud først, så opdateringen bliver stoppet på en pæn måde"],w:"Mimaki: afbryd ikke strømmen, og træk ikke USB-kablet ud, før opdateringen er færdig – ellers kan maskinen blive ude af stand til at starte.",src:"mimakifw"},
 {id:"ele25",t:"mc",q:"Hvilken sikring må sættes i som erstatning ifølge Epsons sikkerhedsanvisninger?",a:["Kun en sikring med den rigtige størrelse og mærkeværdi","En større sikring, så den ikke springer igen","En hvilken som helst sikring, der passer i holderen","Et stykke ledning, indtil den rigtige er kommet hjem"],w:"Epson: udskift kun sikringer med en sikring af korrekt størrelse og mærkeværdi.",src:"epsonfuse"},
 {id:"ele26",t:"mc",q:"Hvad kan en sprunget sikring være tegn på ifølge HP's vejledning til Designjet L25500?",a:["Fejl i maskinens elektriske kredsløb","At sikringen blot var for gammel","At printeren har stået slukket for længe","At rummet har været for koldt"],w:"HP: en sprunget sikring kan tyde på fejl i de elektriske kredsløb. Derfor beder HP brugeren om at tilkalde en servicetekniker i stedet for selv at skifte sikringen.",src:"hpl25500"}
]});

UNITS.push({ id:"kol", title:"Laserens køling & udsugning", sub:"Chiller, frost, kondens og filtre", color:"#2EC4B6", qs:[
 {id:"kol1",t:"mc",q:"Hvor meget af RF-effekten i en RF-laser bliver til laserlys ifølge Thunder Laser?",a:["Kun ca. 10 % – resten bliver til varme","Ca. 50 % – resten bliver til varme","Ca. 90 % – resten bliver til varme","Næsten 100 % – der dannes ingen varme"],w:"Derfor er køling afgørende: varmen skal væk, ellers falder strålekvalitet og effekt, og laseren slides hurtigere.",src:"thunderrf"},
 {id:"kol2",t:"mc",q:"Hvordan køles Epilogs laserrør af metal og keramik ifølge Epilog?",a:["Med luft – blæserne er bygget ind i maskinen","Med vand fra en ekstern køler (chiller)","Med olie, der pumpes rundt om røret","Med trykluft fra air assist-kompressoren"],w:"Epilog: glasrør skal næsten altid vandkøles, mens Epilogs RF-rør af metal og keramik kun behøver blæsere.",src:"epilogtube"},
 {id:"kol3",t:"tf",q:"Næsten alle CO₂-glasrør skal vandkøles.",v:true,w:"Epilog: glas leder varme dårligt, så uden vandkøling ville røret blive overophedet.",src:"epilogtube"},
 {id:"kol4",t:"mc",q:"Hvorfor bruger Thunder Laser destilleret vand i vandkølede glasrør?",a:["Det leder strøm så dårligt, at det kan omgive et rør med ca. 30.000 volt","Det fryser først ved en langt lavere temperatur end postevand","Det køler dobbelt så godt som almindeligt postevand","Det smører pumpen i køleren, så den holder længere"],w:"Tilsætningsstoffer kan ændre ledningsevnen og skade kølesystemet. Thunder Laser fraråder også postevand, fordi det kan tilføre mineraler eller urenheder.",src:["thundercold","thunderchill"]},
 {id:"kol5",t:"mc",q:"Hvilken vandtemperatur er ideel til Thunder Lasers Nova-serie?",a:["15-25 °C","0-5 °C","30-40 °C","45-55 °C"],w:"Hold også lokalet under ca. 27 °C og luftfugtigheden under 70 %.",src:["thundercold","thunderchill"]},
 {id:"kol6",t:"mc",q:"Hvad kan der ske, hvis vandet fryser i et CO₂-glasrør?",a:["Vandet udvider sig og kan sprænge glasset","Røret bliver stærkere, fordi gassen fortættes","Laseren skærer finere, fordi røret er koldt","Ingenting – glasrør tåler frost uden problemer"],w:"Thunder Laser: skader på røret fra frost eller termisk chok dækkes ikke af garantien.",src:"thundercold"},
 {id:"kol7",t:"tf",q:"Når der er frostvæske i køleren, behøver du ifølge Thunder Laser ikke tænke mere på frost.",v:false,w:"Thunder Laser: frostvæske er ikke en 'sæt og glem'-løsning – rør kan stadig sprænge, selv med frostvæske i.",src:"thundercold"},
 {id:"kol8",t:"mc",q:"Køleren skal stå ubrugt i lang tid. Hvad anbefaler Thunder Laser?",a:["Tøm tanken for vand","Fyld tanken helt op med postevand","Skru kølerens temperatur ned på laveste trin","Dæk køleren til med et tæppe"],w:"Ved frostgrader: hold lokalet over 0 °C, brug kølerens konstant-tilstand med varme eller godkendt frostvæske – og tøm tanken, hvis køleren ikke skal bruges i længere tid. Ved frostrisiko skal også laserrør og slanger tømmes.",src:["thunderchill","thundercold"]},
 {id:"kol9",t:"mc",q:"Hvor ofte anbefaler Thunder Laser rutinevedligehold af køleren?",a:["En til to gange om måneden","Én gang hvert femte år","Kun når vandet er blevet grønt","Hver gang laseren har kørt en time"],w:"Rens støvfilteret, og forny vandet. Tjek også før hvert job, at vandstanden står i det grønne felt.",src:"thunderchill"},
 {id:"kol10",t:"mc",q:"Hvornår dannes der kondens på en vandkølet laser ifølge SYNRAD?",a:["Når kølevandet er koldere end luftens dugpunkt","Når kølevandet er varmere end luften i lokalet","Når luftfugtigheden i lokalet er under 20 %","Når laseren har kørt på fuld effekt i en time"],w:"Kondens kan skade både elektronik og laserens optik. Sæt kølerens temperatur lige over dugpunktet.",src:"synradcond"},
 {id:"kol11",t:"mc",ctx:"En varm sommerdag er der 29 °C og 60 % luftfugtighed i kundens lokale. Køleren står på 18 °C, og der er dug på laserens kølerør.",q:"Hvad er løsningen ifølge SYNRADs eksempel?",a:["Hæv kølerens temperatur til lige over dugpunktet – her ca. 22 °C","Sænk kølerens temperatur til 10 °C, så duggen fryser væk","Sluk for udsugningen, så den fugtige luft bliver i maskinen","Tør rørene af hver time, og lad køleren stå på 18 °C"],w:"Ved 29 °C og 60 % relativ luftfugtighed er dugpunktet ca. 21 °C. SYNRAD: vælg en temperatur lige over dugpunktet – ikke et vilkårligt højt tal. Aircondition i lokalet er det mest effektive.",src:"synradcond"},
 {id:"kol12",t:"tf",q:"Ifølge SYNRAD er det bedst at vælge en kølertemperatur langt over dugpunktet for en sikkerheds skyld.",v:false,w:"SYNRAD: vælg ikke et vilkårligt højt tal, men en værdi lige over dugpunktet. For varmt kølevand kan forringe laserens ydelse og levetid.",src:"synradcond"},
 {id:"kol13",t:"mc",q:"Hvad gør en forfiltermåtte i Trotecs Atmos-udsugning?",a:["Fanger groft støv, så finfilteret holder væsentligt længere","Fjerner lugt med aktivt kul, så rummet ikke lugter","Køler den varme luft, før den når frem til turbinen","Dæmper støjen fra udsugningen, mens laseren kører"],w:"Trotec: forfiltermåtten lægges i den øverste ramme og kan forlænge finfilterets levetid betydeligt.",src:"trotecatmos"},
 {id:"kol14",t:"mc",q:"Hvad skal du gøre, før du åbner en Trotec Atmos-udsugning?",a:["Slukke den og koble den fra laseren","Lade den køre, så støvet suges væk","Fylde den med vand for at binde støvet","Tage filteret ud, mens turbinen kører"],w:"Trotec: sluk altid udsugningen, og kobl den fra laseren, før du åbner den.",src:"trotecatmos"},
 {id:"kol15",t:"tf",q:"På en Trotec Atmos falder suget gradvist, efterhånden som filteret fyldes, så du kan mærke, hvornår det skal skiftes.",v:false,w:"Trotec: systemet regulerer selv, så suget er det samme ved 10 % og 90 % mætning. Hold øje med filterstatus på displayet eller i Ruby – filteret skiftes, når det er fuldt.",src:"trotecatmos"},
 {id:"kol16",t:"mc",q:"Hvilket filter i xTools Smoke Purifier kan vaskes og bruges igen?",a:["Kun forfilteret","Kun HEPA-filteret","Kun mellemfilteret","Alle tre filtre"],w:"xTool: skyl forfilteret i rent vand uden sæbe, og lad det tørre helt. HEPA-filteret skiftes; mellemfilteret skiftes, hvis støvet ikke kan fjernes.",src:"xtoolfilter"},
 {id:"kol17",t:"match",q:"Sæt filteret i xTools Smoke Purifier sammen med det anbefalede skifteinterval:",p:[["Forfilter","Hver 7.-15. dag"],["Mellemfilter","Hver 2.-3. måned"],["HEPA-filter","Hver 3.-6. måned"]],w:"Det er xTools vejledende intervaller. Lyder summeren, skal filtrene renses eller skiftes.",src:"xtoolfilter"},
 {id:"kol18",t:"mc",ctx:"Kundens xTool-røgrenser slukker kort efter, den er tændt – også efter en genstart.",q:"Hvad er den sandsynlige årsag ifølge xTool?",a:["Dårlig luftgennemstrømning giver for høj startstrøm, så beskyttelsen slår fra","Laserens linse er snavset og skal renses, før renseren kan køre","Rummet er for koldt til, at blæseren i renseren kan starte","USB-kablet mellem laseren og computeren er for langt"],w:"xTool: dårlig luftgennemstrømning og høj filtermodstand giver for høj startstrøm, og så slår beskyttelsen fra. Sluk renseren, åbn låget, og tjek, at indsugningen ikke er blokeret. Sæt luftmængden på laveste trin, start igen, og skru derefter op efter behov.",src:"xtoolfilter"},
 {id:"kol19",t:"mc",q:"Hvad kan for svag udsugning føre til ifølge Trotec?",a:["Belægninger på optikken, dårligere gravering og større brandrisiko","Skarpere gravering, fordi røgen køler materialet under strålen","Lavere strømforbrug og længere levetid for linse og spejle","Ingenting, så længe air assist er tændt under hele jobbet"],w:"Trotec: støv og røg skal fjernes effektivt – for kvaliteten, for et sikkert arbejdsmiljø, for optikken og for brandsikkerheden.",src:"trotecexh"},
 {id:"kol20",t:"order",q:"Sæt trinene i rækkefølge, første gang en Thunder Laser-køler tages i brug:",s:["Skru låget af den tomme tank","Fyld rent vand på, til vandstanden står i det grønne felt","Tjek vandstanden igen før hvert laserjob","Fyld efter, hvis vandstanden er nået ned i det røde felt"],w:"Brug rent vand – ikke postevand, som kan tilføre mineraler eller urenheder.",src:"thunderchill"},
 {id:"kol21",t:"mc",q:"Hvad skal en luftkølet RF-laser have for at holde sig kold ifølge Thunder Laser?",a:["Rene filtre og blæsere og frie ventilationsåbninger","Frisk destilleret vand i tanken hver måned","En køler, der holder vandet på 15-25 °C","Frostvæske i kredsløbet, når det er under 0 °C"],w:"Støv bremser luftstrømmen. Luftkøling afhænger desuden af temperaturen i lokalet – en luftkølet laser kan ikke køle til under rumtemperatur.",src:["thunderrf","thundercold"]}
]});

UNITS.push({ id:"opl", title:"Oplæring & servicerapport", sub:"Lær kunden op – og skriv det ned", color:"#A9E34B", qs:[
 {id:"opl1",t:"order",q:"Sæt de fire trin i TWI's oplæringsmetode (Job Instruction) i rækkefølge:",s:["Forbered personen","Vis og forklar opgaven","Lad personen prøve selv","Følg op"],w:"TWI Job Instruction: forbered, vis, lad prøve og følg op – i den rækkefølge.",src:"twicard"},
 {id:"opl2",t:"mc",q:"Du skal lære en ny operatør den daglige rens. Hvad gør du først ifølge TWI-metoden?",a:["Får personen til at slappe af og finder ud af, hvad de ved i forvejen","Viser hele rensen i fuldt tempo fra start til slut, så de ser det færdige resultat","Lader dem prøve alene, så du kan se, hvor det går galt for dem","Gennemgår alle fejlkoder i manualen, før I rører ved maskinen"],w:"Trin 1: sæt personen i ro, fortæl om opgaven, find ud af, hvad de ved i forvejen, væk interessen – og stil dem, så de kan se.",src:"twicard"},
 {id:"opl3",t:"mc",q:"Hvor meget viser og forklarer du ad gangen i trin 2?",a:["Ét vigtigt trin ad gangen – ikke mere, end personen kan nå at lære","Hele opgaven på én gang, så personen får overblikket fra starten","Kun det, operatøren selv spørger om undervejs, så I ikke spilder tid på resten","Så meget som muligt, når du nu alligevel er på besøg"],w:"TWI: fortæl, vis og illustrér ét vigtigt trin ad gangen, og fremhæv nøglepunkterne. Giv ikke mere, end personen kan mestre på én gang.",src:"twicard"},
 {id:"opl4",t:"mc",q:"Operatøren har lavet rensen én gang, og du har rettet fejlene. Hvad beder du om i næste gennemløb?",a:["At de forklarer hvert vigtigt trin og nøglepunkt, mens de gør det","At de gør det dobbelt så hurtigt, mens du tager tid på dem","At de ser dig gøre det en gang til uden at røre ved noget","At de skriver under på et skema om, at oplæringen nu er gennemført og godkendt"],w:"TWI trin 3: lad personen udføre opgaven, og ret fejl. Lad dem så gøre det igen og forklare trin, nøglepunkter og begrundelser undervejs.",src:"twicard"},
 {id:"opl5",t:"tf",q:"Ifølge TWI er trin 3 slut, så snart operatøren har prøvet opgaven én gang.",v:false,w:"Fortsæt, til du ved, at personen kan det – og er sikker på, at de har forstået.",src:["twicard","twiroser"]},
 {id:"opl6",t:"mc",q:"Hvad hører med til opfølgningen (trin 4) i TWI-metoden?",a:["At aftale, hvem operatøren kan gå til for at få hjælp","At låse indstillingerne, så de ikke kan ændres","At gentage hele oplæringen forfra en gang om ugen det første år","At teste operatøren skriftligt uden varsel"],w:"TWI trin 4: lad personen arbejde selv, udpeg hvem de kan få hjælp hos, tjek ofte, opfordr til spørgsmål – og træk dig gradvist.",src:"twicard"},
 {id:"opl7",t:"fill",s:"TWI's motto: Har personen ikke lært det, har instruktøren ikke ___.",a:["undervist","haft tid","fået betaling","ansvaret"],w:"På engelsk: 'If the person hasn't learned, the instructor hasn't taught.'",src:"twicard"},
 {id:"opl8",t:"tf",q:"Når du bryder en opgave ned efter TWI-metoden, er sikkerhed altid et nøglepunkt.",v:true,w:"TWI: find de vigtige trin, og udpeg nøglepunkterne – sikkerhed er altid ét af dem.",src:["twicard","twiroser"]},
 {id:"opl9",t:"match",q:"Sæt TWI-trinnet sammen med det, du gør:",p:[["Forbered","Sæt personen i ro, og find ud af, hvad de ved"],["Vis","Fortæl, vis og illustrér ét vigtigt trin ad gangen"],["Lad prøve","Lad dem gøre det og forklare nøglepunkterne"],["Følg op","Udpeg, hvem de kan få hjælp hos, og tjek ofte"]],w:"De fire trin fra TWI's Job Instruction-kort.",src:"twicard"},
 {id:"opl10",t:"mc",q:"Hvem har ifølge arbejdsmiljøreglerne ansvaret for, at kundens ansatte er oplært og instrueret i maskinen?",a:["Arbejdsgiveren – altså kunden selv","Serviceteknikeren, der sidst var på besøg","Producenten, der har bygget maskinen","Den ansatte, der betjener maskinen"],w:"Arbejdsgiveren skal sørge for, at hver enkelt ansat får tilstrækkelig og hensigtsmæssig oplæring og instruktion i at udføre arbejdet farefrit. Din oplæring er en hjælp – ansvaret bliver hos kunden.",src:"atvejl"},
 {id:"opl11",t:"tf",q:"Et oplæringsskema med operatørens underskrift er i sig selv dokumentation for, at instruktionen er givet.",v:false,w:"Arbejdstilsynet: underskrevne skriftlige instruktioner er ikke alene dokumentation. Det afgørende er, om den ansatte faktisk har modtaget instruktionen og forstået den.",src:"atvejl"},
 {id:"opl12",t:"mc",ctx:"Kunden har fået ny printer og siger: \"Vi har printet i 20 år – vi behøver ingen oplæring.\"",q:"Hvad siger Arbejdstilsynets vejledning?",a:["Der skal oplæres og instrueres, når der kommer nyt eller ændret arbejdsudstyr","Oplæring er kun et krav for nyansatte i deres første måned på den nye arbejdsplads","Oplæring er frivillig, så længe maskinen er CE-mærket og har en manual","Oplæring kræves kun, hvis der tidligere har været en ulykke med maskinen"],w:"Oplæring og instruktion skal navnlig ske ved ansættelse, ændrede opgaver, nyt eller ændret arbejdsudstyr og ny teknologi – tilpasset den ansattes uddannelse, alder, rutine og sprog.",src:"atvejl"},
 {id:"opl13",t:"mc",q:"Hvilket sprog skal brugsanvisningen til kundens maskine findes på?",a:["Dansk – og desuden et sprog, som brugeren af maskinen forstår","Engelsk er nok, når det er en professionel maskine","Producentens eget sprog, så intet går tabt i en dårlig oversættelse","Det er valgfrit, når personalet først er blevet oplært"],w:"Bekendtgørelsen om anvendelse af tekniske hjælpemidler § 16: brugsanvisningen skal være forståelig og foreligge på dansk – og på et sprog, som den, der bruger hjælpemidlet, forstår.",src:"bek428"},
 {id:"opl14",t:"mc",q:"Hvor skal brugsanvisningen være, når maskinen er i brug hos kunden?",a:["Let tilgængelig i umiddelbar nærhed af maskinen","Hos forhandleren, så den ikke bliver væk","I et aflåst skab inde på kontoret","Hos teknikeren, der har den med i bilen ved hvert servicebesøg"],w:"§ 16: brugsanvisningen skal være let tilgængelig for brugerne og findes i umiddelbar nærhed af eller i tilknytning til maskinen.",src:"bek428"},
 {id:"opl15",t:"mc",ctx:"Kunden vil lade en medarbejder stå for eftersyn og vedligeholdelse af maskinerne.",q:"Hvad kræver reglerne af arbejdsgiveren?",a:["At medarbejderen er specielt udpeget og har fået oplæring og instruktion","At medarbejderen har mindst fem års anciennitet og har arbejdet med maskintypen før","At medarbejderen er uddannet elektriker eller maskinmester","Ingenting – alle ansatte må vedligeholde alle maskiner"],w:"Ansatte, der står for eftersyn, reparation, ændring, vedligeholdelse eller pasning, skal være specielt udpeget dertil og have fået oplæring og instruktion. Eftersyn og vedligeholdelse skal udføres af en sagkyndig person.",src:"bek428"},
 {id:"opl16",t:"tf",q:"Under rengøring, reparation og vedligeholdelse skal maskinen så vidt muligt være standset og sikret mod igangsætning.",v:true,w:"§ 19 – og det gælder også den rens, du lærer operatøren. Kan maskinen ikke standses, skal arbejdet sikres på anden måde.",src:"bek428"},
 {id:"opl17",t:"mc",q:"Hvad opsummerer en servicerapport?",a:["Det udførte arbejde – fx løste opgaver og brugte dele","Kundens kommende ordrer og leveringstider","Teknikerens køretid, pauser og frokost","Prisen på en ny maskine af samme type"],w:"Microsofts Field Service-dokumentation: servicerapporten opsummerer det udførte arbejde – fx løste opgaver og brugte produkter og dele. Teknikeren kan indhente en underskrift på rapporten, og rapporten kan leveres til kunden som PDF.",src:"msreport"},
 {id:"opl18",t:"mc",q:"Hvad beder HP dig have klar, før du kontakter support om en Latex-printer?",a:["Produktnummer, serienummer og service-id","Kundens CVR-nummer og fakturaadresse","RIP-softwarens licensnøgle og adgangskode","Navnet på den, der installerede printeren"],w:"HP beder også om fejlkoden fra frontpanelet, RIP'en og dens versionsnummer samt rapporten 'service information'.",src:"hp110help"},
 {id:"opl19",t:"mc",ctx:"Kunden har et printkvalitetsproblem på sin HP Latex, og du vil have HP's support med på sagen.",q:"Hvad vil HP ud over printerens data gerne vide?",a:["Hvilket medie der printes på, og hvor mediets preset stammer fra","Hvor mange kvadratmeter kunden printer på en måned – og på hvilke ugedage","Hvilken internetudbyder kunden har til sit netværk","Hvem der sidst skiftede blækpatroner i printeren"],w:"HP: ved printkvalitetsproblemer – mediets reference samt navn og oprindelse på det medie-preset, der blev printet med.",src:"hp110help"},
 {id:"opl20",t:"mc",q:"Hvor finder du serienummer og firmwareversion på en Roland VG4, når de skal med i servicerapporten?",a:["I menuen under System Information → Machine Information","Kun på følgesedlen fra den dag, printeren blev leveret","I VersaWorks under fanen med farveprofiler","På undersiden af de blækposer, der sidder i"],w:"Machine Information viser model, serienummer, blæktype, firmwareversion og MAC-adresse.",src:"vg4menu"},
 {id:"opl21",t:"mc",ctx:"Du overvejer at bruge 'Reset to Factory Defaults' på kundens Roland VG4.",q:"Hvad sker der med kundens indstillinger?",a:["Alt undtagen sprog og enheder nulstilles – også de registrerede medier","Kun netværksindstillingerne nulstilles – de registrerede medier bliver","Kun firmwaren rulles tilbage til den forrige version","Ingenting, før printeren har været slukket i et døgn"],w:"Roland: funktionen sætter alle indstillinger undtagen sprog og enheder – også de registrerede medier – tilbage til fabriksværdier. Aftal det med kunden først.",src:"vg4menu"},
 {id:"opl22",t:"mc",q:"Du skal opdatere Trotec JobControl hos kunden. Hvad gør du først ifølge Trotec?",a:["Opretter en servicefil og eksporterer materialedatabasen","Afinstallerer den gamle version og sletter dens mapper","Nulstiller laseren til fabriksindstillinger","Skifter USB-kablet mellem laser og computer"],w:"Trotec: 'Create service file' under Help gemmer materialedatabasens indstillinger. Eksportér også parametrene med 'Export all', så de kan hentes ind igen efter opdateringen.",src:"trotecsvc"},
 {id:"opl23",t:"mc",q:"Hvad står på Mimakis daglige plejeliste til CJV150 – efter arbejdstid?",a:["Området omkring printhovederne, capping-stationen og wiperen","Smøring af alle føringer og aksler med smøreolie","Udskiftning af dampere, blækslanger og filtre i hele blæksystemet","Tømning og skylning af samtlige blækkanaler"],w:"Dagligt også medieklemmer og sensorer. Ugentligt bl.a. platen, yderside og spildblæktank. Mimaki skriver udtrykkeligt: smør ikke maskinen med olie.",src:"mimakicjv"},
 {id:"opl24",t:"tf",q:"Mimakis plejevejledning til CJV150 opfordrer operatøren til selv at skille maskinen ad, hvis dyserne ikke kommer igen.",v:false,w:"Mimaki: skil aldrig maskinen ad. Hjælper rensetrinnene ikke, skal operatøren kontakte forhandleren eller et servicecenter.",src:"mimakicjv"},
 {id:"opl25",t:"mc",q:"En HP Latex viser en vedligeholdelsesadvarsel på frontpanelet. Hvad siger HP's servicemanual om den slags advarsler?",a:["De fleste kan kunden selv løse – nogle kræver en servicetekniker","Alle advarsler kræver et besøg af en certificeret HP-tekniker, før der må printes","De kan ignoreres, indtil printeren stopper helt af sig selv","De forsvinder altid af sig selv, når printeren genstartes"],w:"Lær derfor operatøren, hvilke advarsler de selv kan klare – og hvornår de skal ringe.",src:"hp300svc"},
 {id:"opl26",t:"mc",q:"Hvad er sidste trin i CompTIA's fejlfindingsmetode?",a:["At dokumentere fund, handlinger, resultat og det, du lærte","At sende fakturaen, mens kunden stadig er glad","At slette fejlloggen, så maskinen starter på en frisk","At skifte de øvrige sliddele for en sikkerheds skyld"],w:"Trinnet før er at bekræfte, at hele systemet virker – helst testet af dem, der bruger det til daglig.",src:"comptiats"},
 {id:"opl27",t:"mc",q:"Hvorfor skal du ifølge CompTIA skrive ned, hvad du har prøvet og ændret?",a:["Det hjælper, hvis fejlen kommer igen, eller ændringen får uventede følger","Det er kun nødvendigt, når kunden udtrykkeligt beder om en skriftlig rapport bagefter","Det gør besøget længere, så der kan faktureres flere timer","Det erstatter testen af maskinen, når tiden er knap"],w:"CompTIA: notaterne er nyttige, hvis et lignende problem dukker op – og de viser andre, hvad du allerede har prøvet.",src:"comptiats"}
]});

UNITS.push({ id:"tex", title:"Tekstilprint & varmepresse", sub:"DTF, DTG, sublimation og flexfolie", color:"#74C0FC", qs:[
 {id:"tex1",t:"order",q:"Sæt DTF-processen i rækkefølge:",s:["Print motivet på DTF-film","Drys hot-melt-pulver på det våde blæk","Varm filmen, så pulveret smelter","Pres motivet over på tekstilet"],w:"Mimaki: der printes på DTF-film med et hvidt lag, hot-melt-pulver lægges på det våde blæk, filmen tørres – og motivet varmepresses over på stoffet.",src:["mimakidtf","rolandspowder"]},
 {id:"tex2",t:"mc",q:"Hvornår skal hot-melt-pulveret på et DTF-print?",a:["Mens blækket stadig er vådt","Når blækket er helt tørt og hærdet","Før der printes – direkte på den rene film","Efter at motivet er presset på tekstilet"],w:"Pulveret lægges jævnt på det våde blæklag og smeltes bagefter. Det er pulveret, der binder motivet til stoffet.",src:["mimakidtf","rolandspowder"]},
 {id:"tex3",t:"mc",q:"I hvilken rækkefølge printes farve og hvidt på Rolands DTF-film til mørke trøjer?",a:["Først farvebilledet – derefter det hvide lag ovenpå","Først det hvide lag – derefter farvebilledet oven på det hvide","Kun det hvide lag – farven kommer fra pulveret","Farve og hvidt på hver sin film, som lægges sammen"],w:"Roland: til mørke trøjer printes farvebilledet først og det hvide lag ovenpå. Til lyse trøjer printes kun farvebilledet.",src:"rolandspowder"},
 {id:"tex4",t:"mc",q:"Hvordan smelter du DTF-pulveret i en varmepresse ifølge Roland?",a:["Pressen holdes svævende over filmen – uden tryk","Pressen lukkes helt med fuldt tryk i ti sekunder","Pressen lukkes kort i 2-5 sekunder som en forpresning","Pressen slukkes, så restvarmen kan klare resten"],w:"Roland: 4-7 mm afstand mellem film og overplade i 3-5 minutter ved 285-300 °F (ca. 140-150 °C). I en ovn: 2-3 minutter ved 210-230 °F (ca. 100-110 °C).",src:"rolandspowder"},
 {id:"tex5",t:"mc",q:"Rolands DTF-film S-F164 er 'cold peel'. Hvad betyder det?",a:["Filmen skal køle helt af, før den trækkes af","Filmen skal trækkes af, mens den er brændende varm","Filmen skal ligge i fryseren, før den presses på","Filmen kan kun bruges på kolde og tykke tekstiler"],w:"Roland: lad filmen køle helt af, og træk den så af, så motivet bliver siddende på stoffet.",src:["rolandspowder","rolanddtfpoly"]},
 {id:"tex6",t:"mc",ctx:"Kunden presser DTF-transfers på polyestertrøjer, og trøjens farve trænger op i motivet.",q:"Hvad anbefaler Roland til polyester?",a:["Lavere temperatur: 135 °C i 10 sekunder med fast tryk","Højere temperatur: 200 °C i 60 sekunder med let tryk","Samme indstilling som til bomuld – men med to lag pulver","At presse helt uden pulver, så klæberen ikke reagerer"],w:"Farvevandring (dye migration) er farvestof fra polyesteren, der vandrer op i motivet efter varmen. Roland: det kan fjernes eller mindskes ved at ændre indstillingerne – 275 °F (135 °C) i 10 sekunder.",src:"rolanddtfpoly"},
 {id:"tex7",t:"tf",q:"Roland anbefaler at presse motivet en ekstra gang, efter at DTF-filmen er trukket af.",v:true,w:"En efterpresning forbedrer vaske- og gnideægtheden. På polyester: 5 sekunder med et slipark over motivet.",src:["rolandspowder","rolanddtfpoly"]},
 {id:"tex8",t:"mc",q:"Hvad gør Mimakis MCT-funktion på TxF-printerne?",a:["Cirkulerer det hvide blæk, så det ikke bundfælder sig","Måler pulverlagets tykkelse med en optisk sensor i tørreren","Køler filmen ned, lige før pulveret lægges på","Skifter automatisk mellem mat og blank DTF-film"],w:"MCT står for Mimaki Circulation Technology. Blækket cirkuleres med jævne mellemrum – og funktionen findes kun til det hvide blæk.",src:"mimakitxf"},
 {id:"tex9",t:"mc",q:"Hvilket pulver anbefaler Mimaki til DTF?",a:["Polyuretan-pulver (PU) med en kornstørrelse omkring 200 mikrometer","PVC-pulver med en kornstørrelse omkring 2 millimeter","Fint talkum, som sigtes ud over filmen i et tykt lag","Akrylpulver, som hærdes med UV-lys fra printerens lampe i stedet for varme"],w:"Mimaki: PU-pulver på ca. 200 mikrometer giver den bedste vedhæftning. Brug film med en tynd og ensartet overflade.",src:"mimakidtf"},
 {id:"tex10",t:"tf",q:"UV-DTF bruger hot-melt-pulver ligesom almindelig DTF.",v:false,w:"Mimaki: UV-DTF bruger UV-hærdende blæk og en anden arbejdsgang – uden hot-melt-pulver.",src:"mimakidtf"},
 {id:"tex11",t:"tf",q:"Åbnede poser med Rolands DTF-pulver skal holdes fri for fugt.",v:true,w:"Roland anbefaler at lægge tørremiddel i de åbnede poser med S-POWDER.",src:"rolandspowder"},
 {id:"tex12",t:"mc",q:"Hvad kan der ske, hvis blækket på en DTG-trykt trøje ikke fikseres ordentligt?",a:["Farverne kan gå af i vask, eller når der gnides på trykket","Trøjen krymper mindst to størrelser i den første vask","Det hvide blæk bliver gennemsigtigt, når det får sollys","Printeren nægter at starte det næste job, før trøjen er helt tør"],w:"Epson: fikseres blækket ikke tilstrækkeligt, kan farverne gå af i vask eller ved gnidning. Fiksér med varmepresse eller varmetunnel.",src:"epsonf2100fix"},
 {id:"tex13",t:"mc",q:"Hvilke vejledende værdier angiver Epson for fiksering af blækket på F2100 i varmepresse?",a:["170 °C – 45 sekunder for farve, op til 90 sekunder med hvidt blæk på motiver større end A4","100 °C – 10 sekunder for både farve og hvidt blæk","250 °C – 5 minutter for farve og 10 minutter med hvidt blæk på motivet","60 °C – natten over under let pres for alle blæktyper"],w:"Epson: 338 °F (170 °C) ved 4,2 N/cm². Er blækket ikke tørt efter 90 sekunder, forlænges tiden. Værdierne er kun vejledende – de afhænger af pressen og blækmængden.",src:"epsonf2100fix"},
 {id:"tex14",t:"mc",q:"Hvad advarer Epson om, hvis varmepressen er varmere end 180 °C (356 °F) ved DTG?",a:["Farverne kan blive matte","Trøjen kan bryde i brand","Det hvide blæk kan blive sort","Trykket kan blive blankt"],w:"Epson: tjek pressens temperatur med en føler. Pressen skal kunne holde mindst 170 °C i 90 sekunder og være større end printpladen.",src:"epsonf2100hp"},
 {id:"tex15",t:"mc",q:"Hvorfor anbefaler Epson bagepapir eller teflonark og lavt tryk, når DTG-blækket fikseres?",a:["Så dampen kan slippe væk","Så trykket bliver mere blankt","Så pressen bruger mindre strøm","Så trøjen ikke kan flytte sig"],w:"Epson: brug bagepapir (silikonepapir) eller et teflonark ved lavt tryk, så dampen kan slippe ud.",src:"epsonf2100hp"},
 {id:"tex16",t:"mc",ctx:"Kunden forbehandler trøjer til hvidt blæk dagen før og lader dem ligge i et fugtigt lokale. Det hvide bliver plettet.",q:"Hvad siger Epson?",a:["Fugt får det hvide blæk til at suge ind – pres trøjen igen lige før print","Forbehandlingen skal vaskes helt ud af trøjen igen, før der printes på den","Trøjen skal ligge i fryseren en time, før den lægges i printeren","Det hvide blæk skal fortyndes med forbehandlingsvæske før brug"],w:"Epson: gør ikke trøjen våd, og lad den ikke ligge længe i fugtige omgivelser efter fiksering af forbehandlingen. Har den ligget fugtigt, så pres den 10-25 sekunder med bagepapir lige før print.",src:"epsonpretreat"},
 {id:"tex17",t:"tf",q:"Efter forbehandling skal trøjen være helt tør, før der printes på den.",v:true,w:"Epson: ellers kan printkvaliteten falde. Forlæng pressetiden, hvis forbehandlingsvæsken ikke er tør.",src:"epsonpretreat"},
 {id:"tex18",t:"mc",q:"Hvor stort et område skal forbehandlingsvæsken påføres ifølge Epson?",a:["Et område, der er større end selve printet","Præcis det område, som selve motivet dækker","Kun kanten rundt om motivet","Hele trøjen – både for og bag"],w:"Epson: påfør væsken jævnt i begge retninger på et område, der er større end printet. Fibrene skal presses flade for at give en ensartet hvid.",src:"epsonf2100pre"},
 {id:"tex19",t:"fill",s:"De tre afgørende faktorer ved varmepresning er tid, temperatur og ___.",a:["tryk","luftfugtighed","farve","hastighed"],w:"Stahls': tid, temperatur og tryk – følg de tre, og vælg materialer, der passer til stoffet.",src:"stahls101"},
 {id:"tex20",t:"mc",q:"Hvorfor forvarmer du tekstilet et par sekunder i pressen, før transferen lægges på?",a:["For at fjerne fugt og folder fra stoffet","For at smelte klæberen lidt på forhånd, så den binder","For at tjekke, om trøjen er farveægte","For at køle pressens underplade ned"],w:"Stahls': fugten skal ud, for at klæberen kan binde. 3-5 sekunder er en god regel – og så kort som muligt på varmefølsomme stoffer som polyester, så det ikke svides.",src:"stahls101"},
 {id:"tex21",t:"mc",ctx:"En transfer ser fin ud, da den kommer ud af pressen – men falder af efter første vask.",q:"Hvor fejler de fleste påføringer ifølge Stahls'?",a:["Ved unøjagtigt tryk","Ved for lang forvarmning","Ved for ny varmepresse","Ved for tykt bagepapir"],w:"Stahls': unøjagtigt tryk er der, hvor de fleste påføringer fejler – transferen kan se fastgjort ud og alligevel falde af i vask. Er du i tvivl, så vælg hellere lidt fastere tryk.",src:"stahls101"},
 {id:"tex22",t:"mc",q:"Hvad gør sømme, lynlåse og knapper, hvis de ligger på pressens plade?",a:["De hindrer trykket og giver problemer med påføring og holdbarhed","De leder varmen bedre ind i selve motivet","De beskytter stoffet mod at blive svedet","De holder transferen på plads under pres"],w:"Stahls': hold dem væk fra pladen – eller brug en pressepude, der optager dem. Puderne er bløde og egner sig ikke til transfers, der kræver fast tryk.",src:"stahls101"},
 {id:"tex23",t:"mc",q:"Hvordan skæres Siser EasyWeed flexfolie på plotteren?",a:["Spejlvendt – motivet skæres omvendt","Retvendt – motivet vendes først i pressen","To gange – andet gennemløb med fuldt tryk","Helt igennem – også gennem bærefilmen"],w:"Siser: skær spejlvendt, og fjern det overskydende materiale, før motivet presses på.",src:"siserew"},
 {id:"tex24",t:"mc",q:"Hvilke indstillinger angiver Siser for EasyWeed i varmepresse?",a:["150 °C, middel tryk, 10-15 sekunder","220 °C, hårdt tryk, 60 sekunder","90 °C, let tryk, 2-3 sekunder","180 °C, intet tryk, 5 minutter"],w:"Forvarm tekstilet 2-3 sekunder. Bærefilmen kan trækkes af varm eller kold. Vent 24 timer før første vask.",src:"siserew"},
 {id:"tex25",t:"mc",q:"Hvorfor skal emnet være hvidt eller lyst ved sublimation?",a:["Farven er ikke dækkende – emnets egen farve ses igennem","Mørke emner bliver alt for varme i varmepressen og tager skade","Hvidt sublimationsblæk tørrer for langsomt på papiret","Lyse emner indeholder altid mere polyester end mørke"],w:"Impressions Magazine: emnet skal være hvidt eller lyst, kunne tåle varmen og trykket – og være lavet af eller belagt med et materiale, der kan optage sublimationsgassen.",src:"subimpr"},
 {id:"tex26",t:"mc",q:"Hvad angiver Sawgrass som udgangspunkt for sublimation på polyester?",a:["204-210 °C i 35-45 sekunder ved middel tryk","120-130 °C i 5-10 sekunder ved let tryk","150 °C i 10 minutter helt uden tryk","300 °C i 2-3 sekunder ved hårdt tryk"],w:"Sawgrass: forvarm trøjen 3-5 sekunder for at fjerne fugt. Tabellen er kun et udgangspunkt – resultatet afhænger også af emnet og en kalibreret presse.",src:"sawgrasspress"},
 {id:"tex27",t:"mc",q:"Hvad hjælper mod skyggebilleder (ghosting) ved sublimation på polyester ifølge Sawgrass?",a:["At fastgøre transferen med klæbespray og bruge beskyttelsespapir","At åbne pressen flere gange undervejs og flytte lidt på papiret","At presse dobbelt så længe ved en lavere temperatur","At lægge transferen med den printede side opad"],w:"Sawgrass: 'Tack spray transfer and use blow-out sheet to avoid ghosting.'",src:"sawgrasspress"},
 {id:"tex28",t:"match",q:"Sæt metoden sammen med det, der kendetegner den:",p:[["DTF","Print på film, pulver og varmepresse"],["DTG","Print direkte på trøjen, som fikseres med varme"],["Sublimation","Farve, der bliver til gas i varmepressen"],["Flexfolie","Skæres spejlvendt og presses på"]],w:"Fire veje til tryk på tekstil – med hver sin maskine og arbejdsgang.",src:["mimakidtf","epsonf2100fix","subimpr","siserew"]}
]});

 {id:"pla8",t:"mc",q:"Hvor meget udvider DIBOND sig med varmen ifølge 3A Composites?",a:["2,4 mm pr. meter pr. 100 °C","0,1 mm pr. meter pr. 100 °C","24 mm pr. meter pr. 100 °C","Den udvider sig slet ikke"],w:"Husk det, når pladen nittes udendørs. Pladen kan anvendes fra -50 °C til +80 °C (ifølge forarbejdningsvejledningen).",src:"dibondproc"},

 {id:"pla10",t:"mc",q:"Hvad er FOREX?",a:["Opskummede, stive PVC-plader","Aluminiumskompositplader med PE-kerne","Massive akrylplader","Plader af presset pap med plastoverflade"],w:"3A Composites: FOREX er lette, opskummede, stive PVC-plader til både inde- og udendørs brug.",src:"forexclassic"},
 {id:"pla11",t:"mc",q:"Hvad bruger du ifølge 3A Composites til at rense FOREX classic?",a:["Kun isopropylalkohol","Acetone","Benzin eller toluen","Fortynder"],w:"3A Composites: brug kun isopropylalkohol. Acetone, benzin, MEK, THF og toluen skal holdes væk fra pladerne.",src:"forexwork"},
 {id:"pla12",t:"mc",ctx:"Kunden har monteret en stor FOREX-plade udendørs med tætte skruehuller. Om sommeren buler pladen.",q:"Hvad er forklaringen ifølge 3A Composites?",a:["Pladen udvider sig med varmen – hullerne skal give plads til bevægelse","Pladen suger vand gennem kanterne og svulmer op i regnvejr","Skruerne ruster i fugten og trykker langsomt pladen ud","Blækket krymper i solen og trækker pladen skæv"],w:"3A Composites: bor et fast hul midt på hver kant og aflange huller til siderne, ca. 20 mm fra kanten – skruehullerne 5-6 mm større end skruen. Ellers vrider og buler pladen.",src:"forexwork"},
 {id:"pla13",t:"mc",q:"Hvor varme kan mørke FOREX-plader blive i solen ifølge 3A Composites?",a:["Op til 60 °C – og op til 80 °C i fx et uventileret butiksvindue","Højst 30 °C, fordi den opskummede PVC isolerer mod varmen","Over 150 °C, så de begynder at smelte på facaden","De bliver ikke varmere end luften"],w:"Derfor er varmeudvidelsen vigtig at tage højde for ved montering.",src:"forexwork"},
 {id:"pla14",t:"mc",q:"Hvad anbefaler 3A Composites, før FOREX printes digitalt?",a:["At pladerne akklimatiserer 24 timer i printrummet","At pladerne lægges i fryseren en time før print","At pladerne vaskes med acetone","At beskyttelsesfilmen rives hurtigt af i ét ryk"],w:"3A Composites: hold luftfugtigheden på mindst 50 %, træk beskyttelsesfilmen langsomt og jævnt af – og blæs ioniseret luft over pladen lige før print, så statisk elektricitet ikke trækker støv til.",src:"forexwork"},
 {id:"pla15",t:"tf",q:"FOREX classic må gerne stanses ved 10 °C.",v:false,w:"3A Composites: FOREX classic bør ikke stanses under 20 °C. Opvarmet til ca. 40 °C bliver snittet bedre med færre brud i kanten.",src:"forexwork"},
 {id:"pla16",t:"mc",q:"Hvad er særligt ved FOREX lite i forhold til FOREX classic?",a:["Den er lavet til printkampagner i store oplag og må kun bruges plant","Den kan termoformes og bukkes varm til buede skilte","Den er lavet af polystyren i stedet for PVC og er derfor lettere","Den har de bedste mekaniske egenskaber i serien"],w:"3A Composites: FOREX lite er den økonomiske plade til printkampagner i store oplag og egner sig kun til plane anvendelser. FOREX classic har de bedste mekaniske egenskaber.",src:["forexlite","forexclassic"]},
 {id:"pla17",t:"mc",q:"Hvad betyder 50/50 på perforeret vinduesfolie?",a:["50 % kan printes, og 50 % er huller","Folien holder i 50 uger","Hullerne sidder 50 mm fra hinanden","Folien slipper ved 50 °C"],w:"PRINTING United Alliance: hullerne er normalt ca. 1,5 mm. Det er afstanden mellem hullerne, der bestemmer forholdet. 70/30 giver mere printflade, men mindre udsyn.",src:"perfpua"},
 {id:"pla18",t:"mc",q:"Hvorfor skal perforeret vinduesfolie lamineres ifølge PRINTING United Alliance?",a:["Så regnvand ikke fylder hullerne og spærrer for udsynet","Så folien kan monteres på indersiden af ruden","Så hullerne lukkes helt, og printet bliver tæt og ensartet","Så folien kan tåle at blive printet med latex"],w:"Arlon anbefaler et optisk klart cast-laminat, hvis folien udsættes for regn.",src:["perfpua","arlondpf"]},
 {id:"pla19",t:"mc",q:"Hvad er Arlons perforerede vinduesfolie DPF 47WF med sort bagside lavet til?",a:["One-way vision på ruder – billedet ses udefra, og man kan se ud indefra","Gulvgrafik, der skal kunne tåle at blive gået på","Lysskilte, hvor lyset skal skinne jævnt gennem folien","Bilfolie til buede flader på karrosseriet"],w:"Arlon: en hvid, perforeret folie med sort bagside og aftagelig klæber. 70/30-mønster med 1,5 mm huller.",src:"arlondpf"},
 {id:"pla20",t:"mc",q:"Hvordan skal Arlons laminerede vinduesfolie monteres?",a:["Med en hård rakel, så laminatet ikke klæber fast på glasset","Med en blød filtrakel og så lidt tryk som muligt","Vådt med sæbevand, så den kan flyttes på plads bagefter","Med varmepistol, så hullerne lukker sig om limen"],w:"Arlon: monter med en hård rakel. Monteringstemperatur 15-40 °C.",src:"arlondpf"},
 {id:"pla21",t:"tf",q:"Ruden må gerne pudses med salmiak- eller solventbaseret glasrens lige før montering af vinduesfolie.",v:false,w:"PRINTING United Alliance: undgå salmiak og andre solventbaserede glasrens (fx Windex) før montering.",src:"perfpua"}
]});

 {t:"DIBOND",b:"Aluminiumskompositplade: to 0,3 mm dæklag af aluminium med kerne af polyethylen. Fræs en V-rille med 0,3 mm restkerne, og buk med hånden. Bukning: mindst r = 15 × tykkelsen. Udvider sig 2,4 mm pr. meter pr. 100 °C.",k:"V-rille: 0,3 mm kerne tilbage.",src:["dibondguide","dibondproc"]},

function markDay(){
  const t=today(); if(S.lastDay===t) return;
  const gap=S.lastDay?daysBetween(S.lastDay,t):99; const fz=S.freeze||0;
  if(gap===1) S.streak++;
  else if(gap>1 && gap-1<=fz && S.streak>0){ S.freeze=fz-(gap-1); S.streak++; S.frozeMsg=gap-1; }
  else S.streak=1;
  S.lastDay=t;
  if(S.streak>0 && S.streak%7===0 && (S.freeze||0)<2 && S.fzAt!==S.streak){ S.freeze=(S.freeze||0)+1; S.fzAt=S.streak; S.fzNew=true; }
  S.best=Math.max(S.best||0,S.streak);
  if(S.frozeMsg){ delete S.frozeMsg; setTimeout(()=>toast(`❄ Streak-frys brugt – din streak er reddet!`),900); }
  if(S.fzNew){ delete S.fzNew; setTimeout(()=>toast(`❄ Du har optjent en streak-frys!`),1500); }
}
function awardXP(xp){

}
