  return e.pass?`<div style="width:100%;margin-top:14px;text-align:left"><div class="cert"><small>GALVO-CERTIFIKAT</small><h4>Service-eksamen bestået</h4><p>${e.acc} % rigtige på ${e.n} spørgsmål fra ${(n=>n===1?'1 enhed':n+' enheder')(UNITS.filter((u,i)=>unlocked(i)).length)} den ${d}.</p><div class="seal">GALVO<br>✓</div></div><button class="btn ghost" style="margin-top:10px" data-share="${esc(`Jeg har bestået Galvo-service-eksamen med ${e.acc} % rigtige! 🔥`)}">Del certifikatet</button></div>`
   :`<div class="row" style="width:100%;margin-top:14px;text-align:left"><p>Du fik ${e.acc} %. Der skal ${EXAM_PASS} % til. Øv dine svage punkter, og prøv igen.</p></div>`; }
function certHtml(u){ const st=unitState(u.id); const d=st.bossDate?new Date(st.bossDate).toLocaleDateString('da-DK',{day:'numeric',month:'long',year:'numeric'}):'';
  return `<div class="cert"><small>MESTERBREV</small><h4>${esc(u.title)}</h4><p>Galvo bekræfter, at du har klaret boss-udkaldet i ${esc(u.title.toLowerCase())}${d?` den ${d}`:''}.</p><div class="seal">GALVO<br>✓</div><button class="sharebtn" data-share="${esc(`Jeg har fået Galvo-mesterbrevet i ${u.title}! 🔥`)}" aria-label="Del mesterbrevet">Del</button></div>`; }
function learnPool(){ const out=[]; UNITS.forEach((u,i)=>{ if(unlocked(i)) (LEARN[u.id]||[]).forEach((c,j)=>out.push({u:i,j,c})); }); return out; }

// ---------- views ----------
let view = {name:'home'};
function go(name){ view={name}; render(); window.scrollTo(0,0); }

function header(){
  const st = liveStreak();
  return `<div class="top"><div class="logo">galvo<span>.</span></div>
  <div class="stats"><span class="stat" style="color:var(--flame)" aria-label="Streak ${st} dage">${IC.flame(st?'#FFB347':'#5A5C80')}${st}</span>
  <button class="stat sbtn" data-go="shop" style="color:var(--acc2)" aria-label="${S.gems||0} ædelsten – åbn butikken">${IC.gem('#4CC9F0')}${(S.gems||0).toLocaleString('da-DK')}</button>
  <button class="stat sbtn" data-go="shop" style="color:#FF7DB8" aria-label="${hearts()} hjerter">${IC.heart(hearts()?'#FF7DB8':'#5A5C80')}${hearts()}</button></div></div>${boostOn()?`<div class="boost">${IC.bolt('#0F1020')} Dobbelt XP aktiv · ${Math.ceil((S.boostUntil-Date.now())/60000)} min tilbage</div>`:''}`;
}
function nav(){
  const items=[['home','Lær','<path d="M3 11l9-7 9 7v9H3z"/>'],['practice','Øv','<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/>'],['badges','Præstationer','<path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M12 14v4M8 21h8"/>'],['profile','Profil','<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>']];
  return `<nav class="nav">${items.map(([k,l,p])=>`<button class="${view.name===k?'on':''}" data-go="${k}" aria-current="${view.name===k?'page':'false'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">${p}</svg>${l}</button>`).join('')}</nav>`;
}
function galvoMood(){
  const tx=todayXP(), h=new Date().getHours(), st=liveStreak();
  if(!S.lessons&&!S.xp) return ['wink','Hej, jeg er Galvo! Klar til dit første kundeudkald?'];
  if(tx>=S.goal) return st>=7?['cool',`Mål nået og ${st} dage i træk. Du kører på fuld effekt!`]:['party',`Dagens mål er nået! ${tx} XP i dag. Du er skarp!`];
  if(h>=23||h<5) return ['sleepy',streakAtRisk()?`Zzz… din streak på ${S.streak} dage venter på dig. Én hurtig lektion?`:'Zzz… nå, er du vågen? Én hurtig lektion, så sover vi begge to.'];
  if(streakAtRisk()){
    if(h>=20) return ['sad',`Flammen på ${S.streak} dage er ved at gå ud! Én lektion redder den.`];
    if(h>=16) return ['worried',`Din streak på ${S.streak} dage er i fare! Én lektion redder den.`];
    return ['wink',`${S.streak} ${S.streak===1?'dag':'dage'} i træk – skal vi gøre det til ${S.streak+1}?`];
  }
  if(tx>0) return ['happy',`${S.goal-tx} XP mere, så er dagens mål nået.`];
  if(!st&&(S.best||0)>=3) return ['sad',`Ingen streak lige nu – din rekord er ${S.best} dage. Skal vi starte en ny i dag?`];
  return ['wink', h<10?'Godmorgen! Kaffe og én lektion?':h<13?'Formiddagsrunde? 3 minutter er nok.':h<17?'Eftermiddagsdip? En fejlfindingssag vækker dig.':'Godaften! Én lektion, så er dagen reddet.'];
}
function level(){ const l=Math.floor(Math.sqrt(S.xp/25))+1; const lo=25*(l-1)**2, hi=25*l**2; return {l,p:(S.xp-lo)/(hi-lo)}; }
const TITLES=['Lærling','Lærling II','Tekniker I','Tekniker II','Tekniker III','Specialist','Specialist II','Senior-tekniker','Ekspert','Mestertekniker'];

function dailyCase(){ const d=new Date(); const n=Math.floor(new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()/864e5); const i=n%CASES2.length; const c=CASES2[i]; const st=(S.cases||{})[c.id]||0;
  return `<button class="dyk" data-case="${i}" style="border-color:var(--acc2)"><small style="color:var(--acc2)">DAGENS SAG · ${esc(c.m.toUpperCase())}</small><b>${esc(c.t)}</b><span>${st?`Dine stjerner: ${'★'.repeat(st)}${'☆'.repeat(3-st)} – kan du få flere?`:`${c.steps.length} trin fra symptom til løsning · op til +25 XP`}</span></button>`; }
function chestSvg(op,rdy){ const b=rdy?'#FFB347':op?'#5A5C80':'#3A3C60', d=rdy?'#B87A1F':op?'#3A3C60':'#2C2E4D';
  return `<svg width="64" height="56" viewBox="0 0 64 56" aria-hidden="true">${op?`<path d="M6 14l26-10 26 10-26 8z" fill="${d}"/>`:`<path d="M6 22a26 14 0 0 1 52 0z" fill="${b}"/>`}<rect x="6" y="22" width="52" height="30" rx="5" fill="${b}"/><rect x="6" y="22" width="52" height="7" fill="${d}"/><rect x="27" y="26" width="10" height="12" rx="2" fill="${d}"/></svg>`; }
function openChest(i){ const u=UNITS[i]; S.chests=S.chests||{}; if(S.chests[u.id]||!unitState(u.id).boss) return; S.chests[u.id]=true; view.exp=i; const g=20+Math.floor(Math.random()*4)*10; addGems(g); save(); sfx('party'); confetti(); render(); toast(`Kisten indeholdt ${g} ædelsten! 💎`); }
function continueBtn(){
  const i=UNITS.findIndex((u,k)=>unlocked(k)&&!unitState(u.id).boss);
  if(i<0) return `<button class="btn cta" data-mode="mix"><small>ALLE ENHEDER ER MESTRET</small>Hold formen ved lige – hurtig blanding</button>`;
  const us=unitState(UNITS[i].id); const boss=us.done>=LESSONS_PER_UNIT; const j=boss?LESSONS_PER_UNIT:us.done;
  return `<button class="btn cta" data-start="${i}" data-j="${j}" data-boss="${boss?1:0}"><small>${S.lessons?'FORTSÆT':'START HER'} · ENHED ${i+1}</small>${esc(UNITS[i].title)} · ${boss?'Boss-udkald':'Lektion '+(j+1)}</button>`;
}
function home(){
  const [mood,msg]=galvoMood(); const lv=level(); const tx=todayXP();
  let units='';
  const shade=(hex,f)=>{ const n=parseInt(hex.slice(1),16); const c=[n>>16,(n>>8)&255,n&255].map(v=>Math.round(v*f)); return `rgb(${c.join(',')})`; };
  let curPlaced=false;
  UNITS.forEach((u,i)=>{
    const us=unitState(u.id), open=unlocked(i);
    const col=u.color||'#FF7A1A';
    const hasLearn=!!LEARN[u.id];
    const folded = us.boss && (S.chests||{})[u.id] && view.exp!==i;
    const canFold = us.boss && (S.chests||{})[u.id];
    units+=`<div class="ban ${open?'':'lk'} ${folded?'fold':''}" style="background:${col}">${canFold?`<button class="banb" data-exp="${i}" aria-expanded="${!folded}" aria-label="${esc(u.title)} – ${folded?'vis lektionerne':'skjul lektionerne'}">`:'<div>'}<small>ENHED ${i+1}${us.boss?' · MESTRET':''}${canFold?(folded?' · SPIL IGEN ▸':' · SKJUL ▾'):''}</small><h3>${esc(u.title)}</h3>${canFold?'</button>':'</div>'}${open&&hasLearn?`<button class="gd" data-learn="${i}" aria-label="Viden-kort: ${esc(u.title)}">${IC.book(open?'#0F1020':'#5A5C80')}</button>`:open?'':`<div class="gd" aria-hidden="true">${IC.lock('#5A5C80')}</div>`}</div>`;
    if(folded) return;
    let nodes='';
    for(let j=0;j<=LESSONS_PER_UNIT;j++){
      const boss = j===LESSONS_PER_UNIT;
      const done = open && (boss?us.boss:us.done>j);
      const cur = open && !done && (boss? us.done>=LESSONS_PER_UNIT : us.done===j);
      const avail = done||cur;
      const x = Math.round(Math.sin((j+i*2)*1.15)*62);
      const title = boss?`Boss-udkald: ${u.title}`:`Lektion ${j+1}`;
      const sub = done?'fuldført – spil igen':cur?'start':'låst';
      const bg = avail?col:'#2C2E4D', sh = avail?shade(col,.62):'#1B1C33';
      const icon = !avail?IC.lock('#5A5C80'):boss?IC.crown(done?'#FFF3D6':'#0F1020'):done?IC.check('#0F1020'):IC.star('#0F1020');
      const isCur = cur && !curPlaced; if(isCur) curPlaced=true;
      nodes+=`<div style="transform:translateX(${x}px);position:relative${isCur&&j===0?';margin-top:30px':''}">${isCur?`<div class="tip">${boss?'BOSS!':j===0&&!us.done?'START':'FORTSÆT'}</div>`:''}<button class="nd ${avail?(cur?'c':'d'):'l'} ${boss?'boss':''}" data-start="${i}" data-j="${j}" data-boss="${boss?1:0}" ${avail?'':'disabled'} aria-label="${esc(title)}, ${sub}" style="background:${bg};box-shadow:0 7px 0 ${sh}">${cur?`<span class="ring" style="border-color:${col}55"></span>`:''}${icon}</button></div>`;
    }
    { const opened=(S.chests||{})[u.id]; const ready=us.boss&&!opened; const x=Math.round(Math.sin((LESSONS_PER_UNIT+1+i*2)*1.15)*62);
      nodes+=`<div style="transform:translateX(${x}px);position:relative;margin-top:${ready?24:4}px">${ready?'<div class="tip">ÅBN!</div>':''}<button class="chest ${ready?'rdy':''} ${opened?'op':''}" data-chest="${i}" ${ready?'':'disabled'} aria-label="${opened?'Kiste åbnet':ready?'Åbn kisten':'Kiste – klar boss-udkaldet først'}">${chestSvg(opened,ready)}</button></div>`; }
    const x1 = Math.sin((1+i*2)*1.15)*62, x2 = Math.sin((2+i*2)*1.15)*62; const gx = (x1+x2)>0?-128:128;
    units+=`<div class="path">${nodes}${open&&!us.boss&&isFinite(gx)?`<div class="pg" style="top:128px;left:clamp(0px, calc(50% + ${gx}px - 48px), calc(100% - 96px))" aria-hidden="true">${G(us.done?'happy':'party','bob')}</div>`:''}</div>`;
  });
  return `${header()}<div class="main">
  <div class="hero"><button id="galvo" aria-label="Tryk på Galvo" style="border:0;background:transparent;padding:0;width:140px;flex-shrink:0">${G(mood,'bob alive')}</button><div class="msg"><div class="lvl">NIVEAU ${lv.l} · ${TITLES[Math.min(lv.l-1,TITLES.length-1)].toUpperCase()}</div><div class="say">${esc(msg)}</div>
  <div class="bar" role="progressbar" aria-valuenow="${Math.min(tx,S.goal)}" aria-valuemax="${S.goal}" aria-label="Dagens mål"><i style="width:${Math.min(100,tx/S.goal*100)}%"></i></div><div class="small">${Math.min(tx,S.goal)}/${S.goal} XP i dag</div></div></div>
  ${continueBtn()}
  ${srsCard()}${questsCard()}${dailyCase()}${dyk()}
  ${units}
  <div class="note">Galvo giver generel viden om fejlfinding og service. Følg altid producentens manual og sikkerhedsanvisninger for den konkrete maskine.</div>
  </div>${nav()}`;
}

const GALVO_LINES=['Bzzzt! Klar til et kundeudkald?','Wiper ren, caps rene – dyserne glade!','Husk: dysetjek før du renser.','Testsnit før store jobs. Altid.','PVC? Aldrig i min laser!','Fokus er alt – også for mig.','Én lektion om dagen holder fejlene væk.','Laserbriller passer til bølgelængden – ikke til outfittet.','Jeg er stolt af dig!','Tre rigtige i træk? Så tænder jeg for strålen!'];
let gLine=-1;
function dyk(){
  const pool=learnPool(); if(!pool.length) return '';
  const d=new Date(); const idx=(d.getFullYear()*372+d.getMonth()*31+d.getDate())%pool.length; const p=pool[idx];
  return `<button class="dyk" data-learn="${p.u}" data-card="${p.j}"><small>VIDSTE DU?</small><b>${esc(p.c.t)}</b><span>${esc(p.c.k)}</span></button>`;
}
function qScore(id){ const st=(S.qst||{})[id]; if(!st) return 0.5; return (st[1]+1)/(st[0]+st[1]+2); }
function weakPool(){ const pool=[]; UNITS.forEach((u,i)=>{ if(unlocked(i)) u.qs.forEach(q=>pool.push(q.id)); }); return shuffle(pool).map(id=>[id,qScore(id)]).sort((a,b)=>b[1]-a[1]).map(x=>allQ[x[0]]); }
function unitStats(u){ let seen=0,r=0,t=0; u.qs.forEach(q=>{ const st=(S.qst||{})[q.id]; if(st){ seen++; r+=st[0]; t+=st[0]+st[1]; } }); return {seen,total:u.qs.length,acc:t?Math.round(r/t*100):null}; }
function topicsHtml(){
  const rows=UNITS.map((u,i)=>({u,i,st:unitStats(u),open:unlocked(i)})).filter(x=>x.open);
  const rated=rows.filter(x=>x.st.acc!==null).sort((a,b)=>a.st.acc-b.st.acc);
  const weakest=rated.length?rated[0]:null;
  return `<div class="list"><div class="row">${rows.map(x=>{ const a=x.st.acc; const col=a===null?'var(--sub)':a>=80?'var(--ok)':a>=60?'var(--flame)':'var(--bad)';
    return `<div class="tp"><div class="tph"><b>${esc(x.u.title)}</b><span style="color:${col}">${a===null?'ikke prøvet':a+' %'}</span></div><div class="tpb"><i style="width:${a===null?0:a}%;background:${col}"></i></div><small>${x.st.seen} af ${x.st.total} spørgsmål set</small></div>`; }).join('')}
   ${weakest&&weakest.st.acc<100?`<p style="margin-top:12px">Dit svageste emne lige nu: <b style="color:var(--tx)">${esc(weakest.u.title)}</b></p>`:''}
   <div style="margin-top:12px"><button class="btn" data-mode="weak" ${rated.length?'':'disabled'}>Øv dine svage punkter</button></div></div></div>`;
}
function practice(){
  const n=S.wrong.length;
  const unlockedQs = UNITS.filter((u,i)=>unlocked(i)).reduce((a,u)=>a+u.qs.length,0);
  const days=[]; for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); days.push(d); }
  const max=Math.max(S.goal,...days.map(d=>S.xpByDay[dayKey(d)]||0));
  const wk=['søn','man','tir','ons','tor','fre','lør'];
  return `${header()}<div class="main">
  <div class="sec">TRÆNING</div>
  <div class="list">
   <div class="row"><h4>Øv dine fejl</h4><p>${n?`${n} spørgsmål, du har svaret forkert på. Svar rigtigt, så forsvinder de fra listen.`:'Ingen fejl at øve lige nu. Flot!'}</p><div style="margin-top:12px"><button class="btn" data-mode="review" ${n?'':'disabled'}>Øv ${n||''} fejl</button></div></div>
   <div class="row"><h4>Dine svage punkter</h4><p>Galvo finder de spørgsmål, du oftest har svaret forkert på, og giver dig dem igen.</p><div style="margin-top:12px"><button class="btn ghost" data-mode="weak" ${Object.keys(S.qst||{}).length?'':'disabled'}>Øv svage punkter</button></div></div>
   <div class="row"><h4>Repetition</h4><p>${srsDue().length?`${srsDue().length} spørgsmål er klar til gentagelse i dag.`:'Ingen repetition i dag. Spørgsmål, du har svaret på, kommer igen efter 1, 3, 7, 14 og 30 dage.'}</p><div style="margin-top:12px"><button class="btn ghost" data-mode="srs" ${srsDue().length?'':'disabled'}>Start repetition</button></div></div>
   <div class="row"><h4>Eksamen</h4><p>Op til ${EXAM_QS} blandede spørgsmål fra de enheder, du har låst op – uden genforsøg. Bestå med ${EXAM_PASS} % og få et Galvo-certifikat (+20 XP ekstra). ${(()=>{const ex=S.exams||[];if(!ex.length) return '';const b=Math.max(...ex.map(e=>e.acc));return `Bedste resultat: <b style="color:var(--tx)">${b} %</b>${ex.some(e=>e.pass)?' · <span style="color:var(--ok)">bestået</span>':''}`;})()}</p><div style="margin-top:12px"><button class="btn" data-mode="exam">Start eksamen</button></div></div>
   <div class="row"><h4>Lyn-runde på tid</h4><p>Svar på så mange som muligt på 60 sekunder. ${S.blitzBest?`Din rekord: <b style="color:var(--tx)">${S.blitzBest}</b>`:'Sæt din første rekord!'}</p><div style="margin-top:12px"><button class="btn" id="blitz" style="background:var(--flame);box-shadow:0 5px 0 #B87A1F">Start lyn-runde</button></div></div>
   <div class="row"><h4>Hurtig blanding</h4><p>5 tilfældige spørgsmål fra de ${unlockedQs} spørgsmål, du har låst op.</p><div style="margin-top:12px"><button class="btn ghost" data-mode="mix">Start blanding</button></div></div>
  </div>
  <div class="sec">FEJLFINDINGSSAGER</div>
  <div class="list">${CASES2.map((c,i)=>{const st=(S.cases||{})[c.id]||0;return `<div class="row" style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><h4>${esc(c.t)}</h4><p>${esc(c.m)} · ${c.steps.length} trin · <span style="color:var(--flame)">${'★'.repeat(st)}${'☆'.repeat(3-st)}</span></p></div><button class="btn ${st?'ghost':''}" style="width:auto;padding:0 18px;height:46px" data-case="${i}">${st?'Igen':'Start'}</button></div>`;}).join('')}</div>
  <div class="sec">VIDEN</div>
  <div class="list">
   <div class="row"><h4>Ordbog</h4><p>${GLOSSARY.length} fagord forklaret på dansk – fra ${esc(GLOSSARY[0][0].toLowerCase())} til ${esc(GLOSSARY[GLOSSARY.length-1][0].toLowerCase())}.</p><div style="margin-top:12px"><button class="btn ghost" data-go="glossary">Åbn ordbogen</button></div></div>
   <div class="row"><h4>Kilder</h4><p>Se alle ${new Set(Object.values(SOURCES).map(x=>x.u)).size} kilder bag spørgsmålene.</p><div style="margin-top:12px"><button class="btn ghost" data-go="sources">Se kilderne</button></div></div>
   ${UNITS.map((u,i)=>unlocked(i)&&LEARN[u.id]?`<div class="row" style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><h4>${esc(u.title)}</h4><p>${LEARN[u.id].length} viden-kort${(S.learned||{})[u.id]?' · læst':''}</p></div><button class="btn ghost" style="width:auto;padding:0 18px;height:46px" data-learn="${i}">Læs</button></div>`:'').join('')}
  </div>
  <div class="sec">DIN UGE</div>
  <div class="list"><div class="row"><div class="week" role="img" aria-label="XP de sidste 7 dage">${days.map(d=>{const v=S.xpByDay[dayKey(d)]||0;return `<div><span>${v}</span><i style="height:${Math.round(v/max*80)}px"></i>${wk[d.getDay()]}</div>`;}).join('')}</div>
  <p style="margin-top:8px">Bedste streak: <b style="color:var(--tx)">${S.best} ${S.best===1?'dag':'dage'}</b> · Lektioner i alt: <b style="color:var(--tx)">${S.lessons}</b></p>
  ${(()=>{ const vals=days.map(d=>S.xpByDay[dayKey(d)]||0); const tot=vals.reduce((a,b)=>a+b,0); const act=vals.filter(v=>v>0).length;
    const rated=UNITS.map((u,i)=>({u,i,st:unitStats(u)})).filter(x=>unlocked(x.i)&&x.st.acc!==null).sort((a,b)=>a.st.acc-b.st.acc);
    const w=rated[0];
    return `<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)"><p><b style="color:var(--tx)">${tot} XP</b> de sidste 7 dage · <b style="color:var(--tx)">${act} ${act===1?'aktiv dag':'aktive dage'}</b>${act>=5?' – stærkt!':''}</p>${w&&w.st.acc<100?`<p style="margin-top:6px">Fokus i næste uge: <b style="color:var(--tx)">${esc(w.u.title)}</b> (${w.st.acc} %)</p><div style="margin-top:10px"><button class="btn ghost" data-mode="weak">Øv dine svage punkter</button></div>`:''}</div>`; })()}
  </div></div>
  </div>${nav()}`;
}

function badges(){
  return `${header()}<div class="main"><div class="sec">PRÆSTATIONER · ${S.badges.length}/${BADGES.length}</div>
  <div class="grid">${BADGES.map(b=>{const on=S.badges.includes(b.id);return `<div class="bdg ${on?'on':''}"><div class="ic">${IC[b.ic](on?'#FF7A1A':'#5A5C80')}</div><b>${esc(b.n)}</b><span>${esc(b.d)}</span></div>`;}).join('')}</div>

let L=null;
const EXAM_QS=20, EXAM_PASS=80;
function startLesson(mode, unitIdx, lessonIdx){
  let qs;
  if(mode==='unit'||mode==='boss'){ qs = shuffle(UNITS[unitIdx].qs).slice(0, mode==='boss'?BOSS_QS:QS_PER_LESSON).map(q=>allQ[q.id]); }
  else if(mode==='single'){ qs = allQ[unitIdx] ? [allQ[unitIdx]] : []; }
  else if(mode==='srs'){ qs = shuffle(srsDue().map(id=>allQ[id])).slice(0,7); }
  else if(mode==='exam'){ const pool=[]; UNITS.forEach((u,i)=>{ if(unlocked(i)) u.qs.forEach(q=>pool.push(allQ[q.id])); }); qs=shuffle(pool).slice(0,EXAM_QS); }
  else if(mode==='weak'){ qs = weakPool().slice(0,QS_PER_LESSON); }
  else if(mode==='review'){ qs = shuffle(S.wrong.map(id=>allQ[id]).filter(Boolean)).slice(0,QS_PER_LESSON); }
  else { const pool=[]; UNITS.forEach((u,i)=>{ if(unlocked(i)) u.qs.forEach(q=>pool.push(allQ[q.id])); }); qs=shuffle(pool).slice(0,QS_PER_LESSON); }
  if(!qs.length) return;
  L={mode,unitIdx,lessonIdx,queue:qs.slice(),total:qs.length,firstTry:{},done:0,combo:0,bestCombo:0,cur:null,state:'ask',pick:null,order:[],retry:new Set(),earned:0};
  next(); view={name:'lesson'}; render(); window.scrollTo(0,0);
}
function next(){
  L.cur=L.queue.shift(); L.state='ask'; L.lostHeart=false; L.pick=null; L.order=[]; L.mp={}; L.msel=null;
  if(L.cur && (L.cur.t==='mc'||L.cur.t==='fill')) L.cur._opts=shuffle(L.cur.a.map((a,i)=>({a,ok:i===0})));
  if(L.cur && L.cur.t==='match'){ L.cur._right=shuffle(L.cur.p.map((p,i)=>({r:p[1],i}))); L.msel=0; }
  if(L.cur && L.cur.t==='order') L.cur._pool=shuffle(L.cur.s.map((s,i)=>({s,i})));
}
function isRight(){
  const q=L.cur;
  if(q.t==='mc'||q.t==='fill') return q._opts[L.pick].ok;
  if(q.t==='match') return q.p.every((p,i)=>L.mp[i]!==undefined && q._right[L.mp[i]].i===i);
  if(q.t==='tf') return L.pick===q.v;
  return L.order.every((idx,pos)=>idx===pos) && L.order.length===q.s.length;
}
function check(){
  const q=L.cur, ok=isRight();
  L.state= ok?'right':'wrong';
  const first = !(q.id in L.firstTry);
  if(first){ L.firstTry[q.id]=ok; S.qst=S.qst||{}; const st=S.qst[q.id]||[0,0]; st[ok?0:1]++; S.qst[q.id]=st; S.answered++; if(ok) S.correct++; srsUpdate(q.id, ok); if(ok) dayBump('correct',1); if(L.mode==='srs') dayBump('srsDone',1); }
  if(ok){ L.done++; L.combo++; L.bestCombo=Math.max(L.bestCombo,L.combo); dayBump('maxCombo',L.combo,true); S.wrong=S.wrong.filter(x=>x!==q.id); if(first) L.earned+=2; }
  else { L.combo=0; if(first && (L.mode==='unit'||L.mode==='boss')){ loseHeart(); L.lostHeart=true; } if(!S.wrong.includes(q.id)) S.wrong.push(q.id); if(L.mode!=='exam' && !L.retry.has(q.id)){ L.retry.add(q.id); L.queue.push(q); } else { L.done++; } }
  say(ok?'Rigtigt':'Forkert'); sfx(ok?'ok':'bad');
  save(); render(); revealSheet();
}
function cont(){ if((L.mode==='unit'||L.mode==='boss') && hearts()<=0){ save(); view={name:'nohearts',fromLesson:true}; render(); window.scrollTo(0,0); return; } if(L.queue.length){ next(); render(); window.scrollTo(0,0); } else finish(); }
function correctText(q){
  if(q.t==='mc'||q.t==='fill') return q.a[0];
  if(q.t==='match') return q.p.map(p=>`${p[0]} → ${p[1]}`).join(' · ');
  if(q.t==='tf') return q.v?'Sandt':'Falsk';
  return q.s.map((s,i)=>`${i+1}. ${s}`).join(' → ');
}

function finish(){

  const p=new URLSearchParams({action:'TEMPLATE',text:'Galvo: 5 minutters service-træning',details:'Hold din streak i live – tag dagens lektion i Galvo.',
    dates:`${ds}T${pad(h)}${pad(mi)}00/${ds}T${pad(end.getHours())}${pad(end.getMinutes())}00`,recur:'RRULE:FREQ=DAILY',ctz:Intl.DateTimeFormat().resolvedOptions().timeZone||'Europe/Copenhagen'});
  return 'https://calendar.google.com/calendar/render?'+p.toString();
}
// ---------- render & events ----------
function render(){
  if(S.onb<ONB.length){ $app.innerHTML=onbView(); return; }
  const v=view.name;
  $app.innerHTML = v==='home'?home():v==='practice'?practice():v==='badges'?badges():v==='profile'?profile():v==='lesson'?lessonView():v==='learn'?learnView():v==='glossary'?glossaryView():v==='blitz'?blitzView():v==='blitzres'?blitzRes():v==='case'?caseView():v==='shop'?shopView():v==='nohearts'?noHeartsView():v==='sources'?sourcesView():v==='caseres'?caseRes():result();
  ttsAfterRender(); galvoIdle();
}
$app.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t||t.disabled) return;
  if(t.dataset.go){ if(view.name==='blitz'){ clearInterval(bTimer); } go(t.dataset.go); return; }
  if(t.dataset.learn!==undefined){ view={name:'learn',u:+t.dataset.learn,i:+(t.dataset.card||0)}; render(); window.scrollTo(0,0); return; }
  if(t.dataset.lnav!==undefined){ learnNav(+t.dataset.lnav); return; }
  if(t.dataset.share){ const txt=t.dataset.share; if(window.Android&&window.Android.share){ window.Android.share(txt); } else if(navigator.share){ navigator.share({title:'Galvo',text:txt}).catch(()=>{}); } else { (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Kopieret – sæt det ind, hvor du vil dele det')).catch(()=>toast(txt)); } return; }
  if(t.id==='onbnext'){ S.onb++; save(); render(); window.scrollTo(0,0); return; }
  if(t.id==='onbskip'){ S.onb=ONB.length; save(); render(); return; }
  if(t.dataset.exp!==undefined){ view.exp = view.exp===+t.dataset.exp ? null : +t.dataset.exp; render(); return; }
  if(t.dataset.chest!==undefined){ openChest(+t.dataset.chest); return; }
  if(t.dataset.buy){ buy(t.dataset.buy); return; }
  if(t.dataset.case!==undefined){ startCase(+t.dataset.case); return; }
  if(t.dataset.cpick!==undefined){ K.pick=+t.dataset.cpick; render(); return; }
  if(t.id==='ccheck'){ caseCheck(); return; }
  if(t.id==='cretry'){ K.state='ask'; K.pick=null; render(); return; }
  if(t.id==='cnext'){ caseNext(); return; }
  if(t.id==='blitz'){ startBlitz(); return; }
  if(t.id==='bquit'){ endBlitz(); return; }
  if(t.dataset.bz!==undefined){ blitzAnswer(t.dataset.bz); return; }
  if(t.dataset.ml!==undefined){ L.msel=+t.dataset.ml; render(); return; }
  if(t.dataset.mr!==undefined){ if(L.msel===null){ toast('Vælg først et punkt til venstre'); return; } const j=+t.dataset.mr; Object.keys(L.mp).forEach(k=>{ if(L.mp[k]===j) delete L.mp[k]; }); L.mp[L.msel]=j; const nxt=L.cur.p.findIndex((_,i)=>L.mp[i]===undefined); L.msel = nxt>=0?nxt:null; render(); return; }
  if(t.dataset.start!==undefined){ if(hearts()<=0){ view={name:'nohearts'}; render(); window.scrollTo(0,0); return; } startLesson(t.dataset.boss==='1'?'boss':'unit', +t.dataset.start, +t.dataset.j); return; }
  if(t.dataset.mode){ startLesson(t.dataset.mode); return; }
  if(t.dataset.goal){ S.goal=+t.dataset.goal; save(); render(); toast('Dagligt mål: '+S.goal+' XP'); return; }
  if(t.dataset.pick!==undefined){ L.pick=+t.dataset.pick; render(); return; }
  if(t.dataset.tf!==undefined){ L.pick=t.dataset.tf==='true'; render(); return; }
  if(t.dataset.order!==undefined){ L.order.push(+t.dataset.order); render(); return; }
  if(t.dataset.unorder!==undefined){ L.order.splice(+t.dataset.unorder,1); render(); return; }
  if(t.id==='galvo'){ const now=Date.now(); tickN = now-tickT<900 ? tickN+1 : 1; tickT=now; const say_=document.querySelector('.hero .say'); const g=t.querySelector('.g');
    let mood, line; if(tickN>=5){ tickN=0; mood='party'; line=GL.tickle[Math.floor(Math.random()*GL.tickle.length)]; confetti(); sfx('party'); } else { gLine=(gLine+1+Math.floor(Math.random()*(GALVO_LINES.length-1)))%GALVO_LINES.length; line=GALVO_LINES[gLine]; mood=['happy','wink','cool','love','think'][gLine%5]; sfx('tap'); }
    if(say_) say_.textContent=line; if(g){ g.innerHTML=GALVO[mood]; g.classList.remove('jump'); void g.offsetWidth; g.classList.add('jump'); } return; }
  if(t.dataset.spk){ if(ttsOn){ stopSpeak(); return; } const sp=screenSpeech(); if(sp){ ttsKey=sp.k; speak(sp.t); } return; }
  if(t.id==='tts'){ S.ttsAuto=!S.ttsAuto; save(); render(); if(S.ttsAuto) speak('Oplæsning er slået til.'); return; }
  if(t.dataset.rate){ S.ttsRate=+t.dataset.rate; save(); render(); speak('Sådan lyder det nu.'); return; }
  if(t.id==='bkcopy'){ copyText(backupCode(),'Koden er kopieret – gem den et sikkert sted'); return; }
  if(t.id==='bkload'){ const o=backupParse((document.getElementById('bkin')||{}).value); if(!o){ toast('Koden kan ikke læses. Kopiér hele koden, og prøv igen.'); return; }
    modal('Gendan fra kode?',`Dine nuværende fremskridt erstattes af kodens: ${o.xp} XP og ${o.streak||0} ${o.streak===1?'dag':'dage'} i træk.`,'Gendan',()=>{ S=Object.assign(fresh(),o); S.onb=ONB.length; tidy(); if(!S.lvlSeen) S.lvlSeen=level().l; save(); go('home'); toast('Fremskridt gendannet'); }); return; }
  if(t.id==='snd'){ S.sound = S.sound===false; save(); render(); if(S.sound) sfx('ok'); return; }
  if(t.id==='check'){ check(); return; }
  if(t.id==='cont'){ cont(); return; }
  if(t.id==='quit'){ modal('Afslut lektionen?','Du mister fremskridtet i denne lektion. Galvo bliver lidt ked af det.','Afslut',()=>go('home')); return; }
  if(t.id==='nrem'){ const on=t.dataset.on!=='1'; const tm=(document.getElementById('nrt')||{}).value||'07:30'; try{ NATIVE.setReminder(tm,on); }catch(e){} render(); toast(on?'Påmindelse slået til kl. '+tm:'Påmindelse slået fra'); return; }
  if(t.id==='reset'){ modal('Nulstil alt?','Alle XP, streak, badges og fremskridt slettes. Det kan ikke fortrydes.','Nulstil',()=>{ S=fresh(); save(); go('home'); toast('Fremskridt nulstillet'); }); return; }
});
$app.addEventListener('input',e=>{ if(e.target.id==='gq'){ const g=document.getElementById('gl'); if(g) g.innerHTML=glossList(e.target.value); } });
$app.addEventListener('change',e=>{ if(e.target.id==='rt'){ S.remind=e.target.value||'07:30'; save(); render(); }
  if(e.target.id==='nrt'&&NATIVE){ const r=nativeRem(); try{ NATIVE.setReminder(e.target.value||'07:30', r.on); }catch(x){} render(); } });
render();
if(NATIVE){ try{ NATIVE.setQuestions(JSON.stringify(Object.values(allQ).filter(q=>!q.ctx).map(q=>({id:q.id,q:(q.t==='fill'?q.s.replace('___','_____'):q.q),u:(UNITS.find(u=>u.id===q.unit)||{}).title||''})))); NATIVE.saveState(JSON.stringify(S)); }catch(e){} try{ NATIVE.setCases(JSON.stringify(CASES2.map(c=>({id:c.id,t:c.t,m:c.m,n:c.steps.length})))); }catch(e){} }
window.galvoQuestion = id => { if(id.indexOf('case_')===0){ const i=+id.slice(5); if(CASES2[i]) startCase(i); return; } if(id.indexOf('go_')===0){ const v=id.slice(3); if(['shop','practice','badges','home'].includes(v)) go(v); return; } if(allQ[id]) startLesson('single', id); };
window.galvoRefresh = () => { if(['home','practice','badges','profile','shop'].includes(view.name)&&!document.querySelector('.modal')&&S.onb>=ONB.length) render(); };
window.galvoBack = () => { const m=document.querySelector('.modal'); if(m){ m.remove(); return true; } if(S.onb<ONB.length) return false; if(view.name==='lesson'||view.name==='case'){ const q=document.getElementById('quit'); if(q) q.click(); return true; } if(view.name==='blitz'){ endBlitz(); return true; } if(['glossary','sources','caseres','blitzres'].includes(view.name)){ go('practice'); return true; } if(view.name!=='home'){ go('home'); return true; } return false; };
})();
</script>
