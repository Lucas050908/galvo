<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galvo – lær service på 5 minutter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F1020;--sf:#1A1C33;--sf2:#22244A;--tx:#F2F0FF;--sub:#A9A6C8;--acc:#FF7A1A;--accd:#C25300;--acc2:#4CC9F0;--line:#2C2E4D;--ok:#3DDC97;--okbg:#10322A;--bad:#FF6B6B;--badbg:#3A1A22;--flame:#FFB347}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Space Grotesk',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
a{color:var(--acc2)}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 6px}
.logo{font-size:24px;font-weight:700}.logo span{color:var(--acc)}
.stats{display:flex;gap:14px;font-weight:700}
.stat{display:flex;gap:4px;align-items:center}
.hero{margin:8px 20px 0;position:relative;min-height:168px;border-radius:22px;background:radial-gradient(circle at 25% 60%,rgba(255,122,26,.35),transparent 60%),var(--sf);border:1px solid var(--line);overflow:hidden;display:flex;align-items:center;gap:6px;padding:10px 14px 10px 4px}
.hero .g{width:140px;flex-shrink:0}
#galvo .g{width:140px}
.hero .msg{flex:1}
.lvl{font-size:12px;color:var(--sub);letter-spacing:.08em;font-weight:600}
.say{font-size:18px;font-weight:700;line-height:1.3;margin-top:4px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .5s}
.small{font-size:12px;color:var(--sub);margin-top:4px}
.sec{padding:20px 20px 8px;font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.1em}
.main{flex:1;overflow-y:auto;padding-bottom:90px}
.unit{margin:6px 20px 14px;border-radius:18px;border:1px solid var(--line);background:var(--sf);overflow:hidden}
.unit h3{margin:0;font-size:18px}
.uh{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.uh .s{font-size:13px;color:var(--sub);margin-top:2px}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;background:var(--sf2);color:var(--sub);white-space:nowrap}
.steps{display:flex;flex-direction:column;gap:10px;padding:0 16px 16px}
.step{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:transparent;border:0;padding:0}
.dot{width:22px;height:22px;border-radius:50%;flex-shrink:0}
.dot.d{background:var(--acc);box-shadow:0 0 12px var(--acc)}
.dot.c{border:4px solid var(--acc2);box-shadow:0 0 16px var(--acc2);background:var(--bg)}
.dot.l{background:var(--line)}
.card{flex:1;background:var(--sf2);border:1px solid var(--line);border-radius:14px;padding:11px 14px;min-height:48px}
.card.c{border-color:var(--acc2);box-shadow:0 0 22px rgba(76,201,240,.22)}
.card b{display:block;font-size:15px}
.card span{font-size:12px;color:var(--sub)}
.card.c span{color:var(--acc2)}
.step:disabled .card b{color:var(--sub)}
.step:disabled{cursor:default}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:var(--sf);border-top:1px solid var(--line);padding:4px 6px calc(10px + env(safe-area-inset-bottom));z-index:5}
.nav button{flex:1;height:56px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;color:var(--sub)}
.nav button.on{color:var(--acc)}
.nav svg{width:24px;height:24px}
.btn{width:100%;height:54px;border-radius:16px;border:0;background:var(--acc);color:#1A0D00;font-size:17px;font-weight:700;box-shadow:0 5px 0 var(--accd)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--accd)}
.btn:disabled{background:var(--line);color:var(--sub);box-shadow:none}
.btn.ghost{background:var(--sf2);color:var(--tx);box-shadow:0 5px 0 #0A0B18;border:1px solid var(--line)}
.btn.ok{background:var(--ok);color:#06251A;box-shadow:0 5px 0 #1E8F5F}
.btn.bad{background:var(--bad);color:#2A0A0A;box-shadow:0 5px 0 #B23A3A}
/* lesson */
.lt{display:flex;align-items:center;gap:14px;padding:18px 20px 0}
.x{width:44px;height:44px;border-radius:12px;border:0;background:transparent;font-size:28px;color:var(--sub);line-height:1}
.prog{flex:1;height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.prog>i{display:block;height:100%;background:var(--acc);border-radius:7px;transition:width .35s}
.combo{font-weight:700;color:var(--flame);min-width:40px;text-align:right}
.qwrap{flex:1;display:flex;flex-direction:column;padding:18px 20px 0}
.qhead{display:flex;gap:10px;align-items:flex-start}
.qhead .g{width:84px;flex-shrink:0}
.qtag{font-size:12px;font-weight:700;color:var(--acc2);letter-spacing:.08em}
.qtext{font-size:20px;font-weight:700;line-height:1.3;margin-top:4px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;min-height:56px;padding:10px 16px;border-radius:16px;border:1px solid var(--line);background:var(--sf);font-size:16px;font-weight:600}
.opt.sel{border-color:var(--acc2);box-shadow:0 0 16px rgba(76,201,240,.3);background:#13233A}
.opt.right{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.opt .k{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;color:var(--sub)}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.tf .opt{justify-content:center;font-size:18px;min-height:72px}
.ord-ans{min-height:64px;border:1px dashed var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;margin-top:16px}
.ord-ans .ph{color:var(--sub);font-size:14px;text-align:center;padding:10px}
.chip{display:flex;gap:10px;align-items:center;text-align:left;padding:10px 14px;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--sf);font-size:15px;font-weight:600}
.chip .n{width:24px;height:24px;border-radius:50%;background:var(--acc);color:#1A0D00;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.ord-pool{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.chip.used{opacity:.25}
.foot{padding:16px 20px 24px}
.sheet{padding:18px 20px 24px;display:flex;flex-direction:column;gap:10px;animation:up .25s ease-out}
.sheet.ok{background:var(--okbg)}.sheet.bad{background:var(--badbg)}
.sheet h4{margin:0;font-size:22px;display:flex;gap:8px;align-items:center}
.sheet.ok h4{color:var(--ok)}.sheet.bad h4{color:var(--bad)}
.sheet p{margin:0;font-size:15px;line-height:1.45}
.sheet .src{font-size:12px;color:var(--sub)}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.bob{animation:bob 2.4s ease-in-out infinite}
.shake{animation:shake .3s}
.pop{animation:pop .5s ease-out}
/* result */
.res{flex:1;display:flex;flex-direction:column;align-items:center;padding:40px 20px 0;text-align:center;position:relative}
.res .g{width:220px}
.res h2{font-size:32px;margin:4px 0}
.glow{position:absolute;top:60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,122,26,.4),transparent 65%);pointer-events:none}
.rstats{display:flex;gap:10px;width:100%;margin-top:22px}
.rs{flex:1;border-radius:16px;border:1px solid var(--line);background:var(--sf);padding:12px 6px}
.rs small{display:block;font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.08em}
.rs b{font-size:26px}
.badge-new{margin-top:14px;width:100%;padding:12px 14px;border-radius:16px;background:var(--sf);border:1px solid var(--acc);display:flex;gap:12px;align-items:center;text-align:left}
/* lists */
.list{display:flex;flex-direction:column;gap:10px;padding:0 20px}
.row{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.row h4{margin:0 0 4px;font-size:16px}
.row p{margin:0;font-size:14px;color:var(--sub);line-height:1.45}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:0 20px}
.bdg{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center}
.bdg .ic{width:52px;height:52px;margin:0 auto 6px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--sf2)}
.bdg.on{border-color:var(--acc)}.bdg.on .ic{background:rgba(255,122,26,.18)}
.bdg b{display:block;font-size:13px}.bdg span{font-size:11px;color:var(--sub)}
.bdg:not(.on){opacity:.55}
.week{display:flex;align-items:flex-end;gap:8px;height:120px;padding:10px 4px 0}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--sub)}
.week i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,var(--acc),var(--accd));min-height:3px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:64px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--sf2);font-weight:700}
.seg button.on{border-color:var(--acc);color:var(--acc)}
input[type=time]{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--sf2);color:var(--tx);font-family:inherit;font-size:16px;padding:0 12px}
label{font-size:14px;color:var(--sub)}
.modal{position:fixed;inset:0;background:rgba(5,6,15,.75);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal>div{width:100%;max-width:480px;background:var(--sf);border-radius:22px 22px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;animation:up .2s}
.modal h3{margin:0;font-size:20px}.modal p{margin:0;color:var(--sub);line-height:1.45}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--sf2);border:1px solid var(--acc);padding:10px 16px;border-radius:14px;font-weight:700;z-index:30;animation:pop .3s}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:15}
.conf i{position:absolute;top:-20px;width:9px;height:15px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.note{font-size:12px;color:var(--sub);line-height:1.5;padding:16px 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.lcard{margin:14px 20px 0;background:var(--sf);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px;animation:up .25s ease-out}
.lcard h2{margin:0;font-size:24px}
.lcard p{margin:0;font-size:17px;line-height:1.5}
.key{background:rgba(255,122,26,.12);border:1px solid rgba(255,122,26,.45);border-radius:14px;padding:12px 14px;font-weight:700;font-size:15px;line-height:1.4}
.key small{display:block;color:var(--acc);font-size:11px;letter-spacing:.1em;margin-bottom:2px}
.illu{background:#13142A;border-radius:14px;padding:8px}
.illu svg{width:100%;height:auto;display:block;font-family:inherit}
.dots{display:flex;gap:6px;justify-content:center;margin-top:14px}
.dots i{width:8px;height:8px;border-radius:4px;background:var(--line);transition:width .2s}
.dots i.on{width:22px;background:var(--acc)}
.ctx{margin-top:12px;background:var(--sf2);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 14px;font-size:15px;line-height:1.4;color:var(--tx)}
.ctx b{display:block;font-size:11px;letter-spacing:.1em;color:var(--acc2);margin-bottom:2px}
.fillq{font-size:20px;font-weight:700;line-height:1.5;margin-top:16px}
.blank{display:inline-block;min-width:90px;padding:0 10px;border-bottom:3px solid var(--acc2);color:var(--acc2);text-align:center}
.blank.right{color:var(--ok);border-color:var(--ok)}.blank.wrong{color:var(--bad);border-color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.chips .opt{min-height:48px;padding:8px 16px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.mcol{display:flex;flex-direction:column;gap:10px}
.mi{min-height:58px;padding:8px 10px;border-radius:14px;border:2px solid var(--line);background:var(--sf);font-size:14px;font-weight:600;text-align:left;line-height:1.25;position:relative}
.mi.sel{border-color:var(--acc2);box-shadow:0 0 14px rgba(76,201,240,.3)}
.mi .tag{position:absolute;top:-8px;right:-6px;width:22px;height:22px;border-radius:11px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#0F1020}
.mres{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.mres div{display:flex;gap:8px;align-items:stretch}
.mres span{flex:1;padding:10px;border-radius:12px;background:var(--sf);border:1px solid var(--line);font-size:14px}
.mres .ok{border-color:var(--ok);color:var(--ok);background:var(--okbg)}.mres .no{border-color:var(--bad);color:var(--bad);background:var(--badbg)}
.dyk{margin:14px 20px 0;padding:14px 16px;border-radius:18px;background:linear-gradient(135deg,rgba(76,201,240,.14),rgba(255,122,26,.12));border:1px solid var(--line);text-align:left;width:calc(100% - 40px);display:block}
.dyk small{color:var(--acc2);font-weight:700;letter-spacing:.1em;font-size:11px}
.dyk b{display:block;font-size:16px;margin:2px 0}
.dyk span{font-size:14px;color:var(--sub);line-height:1.4}
.blz-top{display:flex;align-items:center;gap:12px;padding:18px 20px 0}
.blz-time{font-size:28px;font-weight:700;color:var(--flame);min-width:56px}
.blz-score{margin-left:auto;font-size:22px;font-weight:700;color:var(--acc2)}
.tbar{height:10px;border-radius:5px;background:var(--line);margin:10px 20px 0;overflow:hidden}
.tbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--flame),var(--acc));transition:width 1s linear}
.flash-ok{animation:fok .35s}.flash-bad{animation:fbad .35s}
@keyframes fok{0%{box-shadow:inset 0 0 0 999px rgba(61,220,151,.25)}100%{box-shadow:none}}
@keyframes fbad{0%{box-shadow:inset 0 0 0 999px rgba(255,107,107,.25)}100%{box-shadow:none}}
.gsearch{width:100%;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--sf2);color:var(--tx);font-family:inherit;font-size:16px;padding:0 14px}
.gl{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.gl div{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.gl b{display:block;font-size:15px;color:var(--acc)}
.gl span{font-size:14px;color:var(--sub);line-height:1.45}
.back{border:0;background:transparent;color:var(--sub);font-size:15px;font-weight:700;padding:18px 20px 0;display:flex;gap:6px;align-items:center;min-height:44px}
.quests{margin:14px 20px 0;padding:14px 16px;border-radius:18px;background:var(--sf);border:1px solid var(--line)}
.quests h4{margin:0 0 10px;font-size:13px;letter-spacing:.1em;color:var(--sub);display:flex;justify-content:space-between}
.qrow{display:flex;gap:12px;align-items:center;padding:6px 0}
.qic{width:34px;height:34px;border-radius:10px;background:var(--sf2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.qrow.done .qic{background:rgba(61,220,151,.18)}
.qbody{flex:1;min-width:0}
.qbody b{font-size:14px;display:block}
.qbar{height:6px;border-radius:3px;background:var(--line);margin-top:5px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--acc2);border-radius:3px}
.qrow.done .qbar i{background:var(--ok)}
.qxp{font-size:12px;font-weight:700;color:var(--flame)}
.srs{margin:14px 20px 0;padding:14px 16px;border-radius:18px;border:1px solid var(--acc2);background:rgba(76,201,240,.08);display:flex;gap:12px;align-items:center}
.srs .t{flex:1}.srs b{display:block;font-size:16px}.srs span{font-size:13px;color:var(--sub)}
.alive{animation:wig 7s ease-in-out infinite;transform-origin:50% 90%;cursor:pointer}
@keyframes wig{0%,86%,100%{transform:rotate(0)}89%{transform:rotate(-6deg)}92%{transform:rotate(5deg)}95%{transform:rotate(-3deg)}}
.jump{animation:jump .6s ease-out}
@keyframes jump{0%{transform:translateY(0)}30%{transform:translateY(-22px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}100%{transform:none}}
.lvlup{margin-top:14px;width:100%;padding:14px;border-radius:18px;background:linear-gradient(135deg,rgba(255,122,26,.25),rgba(76,201,240,.18));border:1px solid var(--acc);animation:pop .6s ease-out}
.lvlup small{display:block;color:var(--acc);font-weight:700;letter-spacing:.12em;font-size:12px}
.lvlup b{font-size:22px}
.cert{background:linear-gradient(160deg,#FFF7EC,#FDE7CC);color:#2B1A0A;border-radius:18px;padding:18px;border:3px double #C77A2A;position:relative;overflow:hidden}
.cert small{display:block;letter-spacing:.14em;font-size:11px;font-weight:700;color:#9A4E00}
.cert h4{margin:4px 0 6px;font-size:20px}
.cert p{margin:0;font-size:13px;line-height:1.45;color:#5B3A1E;padding-right:64px}
.cert .seal{position:absolute;right:12px;bottom:10px;width:54px;height:54px;border-radius:50%;background:#E85D04;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;text-align:center;line-height:1.05;box-shadow:0 0 0 4px #FFB347}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sw{width:56px;height:32px;border-radius:16px;border:0;background:var(--line);position:relative;flex-shrink:0}
.sw::after{content:'';position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:12px;background:#fff;transition:left .2s}
.sw[aria-checked=true]{background:var(--acc)}.sw[aria-checked=true]::after{left:28px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.tp{margin-bottom:12px}.tph{display:flex;justify-content:space-between;gap:10px;font-size:14px}.tph span{font-weight:700;white-space:nowrap}.tpb{height:8px;border-radius:5px;background:rgba(255,255,255,.08);margin:6px 0 3px;overflow:hidden}.tpb i{display:block;height:100%;border-radius:5px}.tp small{color:var(--sub);font-size:12px}
</style>
</head>
<body>
<div id="app"></div>
<div id="live" class="sr" aria-live="polite"></div>
<script>
// Spørgsmål. Typer: mc (flere valg, første svar er korrekt), tf (sandt/falsk), order (trin i rigtig rækkefølge)
const UNITS = [
{ id:"sik", title:"Sikkerhed først", sub:"Laser, el og valser", color:"#E03131", qs:[
 {id:"sik1",t:"mc",q:"Du skal arbejde på elektronikken inde i en maskine. Hvad gør du først?",a:["Slukker, tager stikket ud og bruger ESD-armbånd","Slukker bare på tænd/sluk-knappen","Arbejder forsigtigt med strømmen på","Beder kunden holde øje"],w:"Tag altid stikket ud, så der ikke er strøm i maskinen, og brug ESD-armbånd, så statisk elektricitet ikke ødelægger printkort."},
 {id:"sik2",t:"tf",q:"Det er i orden at kortslutte lågets sikkerhedsafbryder på en lukket laser for at se strålen under fejlfinding.",v:false,w:"Aldrig. Sikkerhedsafbryderen (interlock) beskytter øjnene. En lukket lasermaskine er kun sikker, når låget er lukket."},

function galvoMood(){
  const tx=todayXP();
  if(tx>=S.goal) return ['party',`Dagens mål er nået! ${tx} XP i dag. Du er skarp!`];
  if(streakAtRisk()) return ['worried',`Din streak på ${S.streak} dage er i fare! Én lektion redder den.`];
  const h=new Date().getHours();
  const hi = h<10?'Godmorgen!':h<17?'Hej igen!':'Godaften!';
  if(!S.lessons) return ['happy','Hej, jeg er Galvo! Klar til dit første kundeudkald?'];
  return ['happy',`${hi} ${S.goal-tx} XP mere, så er dagens mål nået.`];
}

// ---------- lesson engine ----------
let L=null;
const EXAM_QS=20, EXAM_PASS=80;
function startLesson(mode, unitIdx, lessonIdx){
  let qs;
  if(mode==='unit'||mode==='boss'){ qs = shuffle(UNITS[unitIdx].qs).slice(0, mode==='boss'?BOSS_QS:QS_PER_LESSON).map(q=>allQ[q.id]); }
  else if(mode==='single'){ qs = allQ[unitIdx] ? [allQ[unitIdx]] : []; }
  else if(mode==='srs'){ qs = shuffle(srsDue().map(id=>allQ[id])).slice(0,7); }
  else if(mode==='exam'){ const pool=[]; UNITS.forEach((u,i)=>{ if(unlocked(i)) u.qs.forEach(q=>pool.push(allQ[q.id])); }); qs=shuffle(pool).slice(0,EXAM_QS); }
  else if(mode==='weak'){ qs = weakPool().slice(0,QS_PER_LESSON); }
  else if(mode==='review'){ qs = shuffle(S.wrong.map(id=>allQ[id]).filter(Boolean)).slice(0,QS_PER_LESSON); }
  else { const pool=[]; UNITS.forEach((u,i)=>{ if(unlocked(i)) u.qs.forEach(q=>pool.push(allQ[q.id])); }); qs=shuffle(pool).slice(0,QS_PER_LESSON); }
  if(!qs.length) return;
  L={mode,unitIdx,lessonIdx,queue:qs.slice(),total:qs.length,firstTry:{},done:0,combo:0,bestCombo:0,cur:null,state:'ask',pick:null,order:[],retry:new Set(),earned:0};
  next(); view={name:'lesson'}; render(); window.scrollTo(0,0);
}
function next(){
  L.cur=L.queue.shift(); L.state='ask'; L.pick=null; L.order=[]; L.mp={}; L.msel=null;
  if(L.cur && (L.cur.t==='mc'||L.cur.t==='fill')) L.cur._opts=shuffle(L.cur.a.map((a,i)=>({a,ok:i===0})));
  if(L.cur && L.cur.t==='match'){ L.cur._right=shuffle(L.cur.p.map((p,i)=>({r:p[1],i}))); L.msel=0; }
  if(L.cur && L.cur.t==='order') L.cur._pool=shuffle(L.cur.s.map((s,i)=>({s,i})));
}
function isRight(){
  const q=L.cur;
  if(q.t==='mc'||q.t==='fill') return q._opts[L.pick].ok;
  if(q.t==='match') return q.p.every((p,i)=>L.mp[i]!==undefined && q._right[L.mp[i]].i===i);
  if(q.t==='tf') return L.pick===q.v;
  return L.order.every((idx,pos)=>idx===pos) && L.order.length===q.s.length;
}
function check(){
  const q=L.cur, ok=isRight();
  L.state= ok?'right':'wrong';
  const first = !(q.id in L.firstTry);
  if(first){ L.firstTry[q.id]=ok; S.qst=S.qst||{}; const st=S.qst[q.id]||[0,0]; st[ok?0:1]++; S.qst[q.id]=st; S.answered++; if(ok) S.correct++; srsUpdate(q.id, ok); if(ok) dayBump('correct',1); if(L.mode==='srs') dayBump('srsDone',1); }
  if(ok){ L.done++; L.combo++; L.bestCombo=Math.max(L.bestCombo,L.combo); dayBump('maxCombo',L.combo,true); S.wrong=S.wrong.filter(x=>x!==q.id); if(first) L.earned+=2; }

  sfx(ok?'ok':'bad'); B.lock=true; const w=document.getElementById('bq'); if(w) w.classList.add(ok?'flash-ok':'flash-bad');
  setTimeout(()=>{ B.lock=false; if(view.name!=='blitz') return; blitzNext(); render(); }, ok?250:600);
}
function endBlitz(){
  clearInterval(bTimer); bTimer=null; if(!B||view.name!=='blitz') return;
  const xp=Math.min(B.score,20); const rec = B.score>(S.blitzBest||0);
  S.blitzBest=Math.max(S.blitzBest||0,B.score); S.blitzPlays=(S.blitzPlays||0)+1; dayBump('blitz',1);
  let aw={before:liveStreak(),goalHit:false}; if(xp>0) aw=awardXP(xp);
  const nb=checkBadges(); save();
  view={name:'blitzres',xp,rec,nb,goalHit:aw.goalHit,lvl:aw.lvlUp}; render(); if(B.score>0){ confetti(); sfx(aw.lvlUp?'level':'party'); }
}
function blitzRes(){
  const v=view; const seen=new Set(); const miss=B.missed.filter(q=>!seen.has(q.id)&&seen.add(q.id));
  return `<div class="res" style="padding-top:30px"><div class="glow"></div>${G(B.score>0?'party':'worried','pop')}<h2>${v.rec?'Ny rekord!':'Tiden er gået!'}</h2><div style="color:var(--sub);font-weight:600">${B.score} rigtige på ${BLITZ_SECS} sekunder${v.goalHit?' · Dagens mål er nået!':''}</div>
  <div class="rstats"><div class="rs" style="border-color:var(--acc2)"><small>RIGTIGE</small><b style="color:var(--acc2)">${B.score}</b></div><div class="rs" style="border-color:var(--acc)"><small>XP</small><b style="color:var(--acc)">+${v.xp}</b></div><div class="rs" style="border-color:var(--flame)"><small>REKORD</small><b style="color:var(--flame)">${S.blitzBest}</b></div></div>
  ${lvlUpHtml(v.lvl)}
  ${v.nb.map(b=>`<div class="badge-new"><div class="ic" style="width:44px;height:44px;border-radius:12px;background:rgba(255,122,26,.18);display:flex;align-items:center;justify-content:center">${IC[b.ic]('#FF7A1A')}</div><div><b>Nyt badge: ${esc(b.n)}</b><div style="font-size:13px;color:var(--sub)">${esc(b.d)}</div></div></div>`).join('')}
  ${miss.length?`<div style="width:100%;text-align:left;margin-top:16px"><div class="sec" style="padding:0 0 8px">DET SKAL DU HUSKE</div>${miss.map(q=>`<div class="row" style="margin-bottom:8px"><h4 style="font-size:15px">${esc(q.t==='fill'?q.s.replace('___','_____'):q.q)}</h4><p><b style="color:var(--ok)">${esc(correctText(q))}</b> – ${esc(q.w)}</p></div>`).join('')}</div>`:''}
  </div><div class="foot" style="display:flex;gap:10px"><button class="btn ghost" data-go="practice" style="flex:1">Færdig</button><button class="btn" id="blitz" style="flex:1">Igen!</button></div>`;
}

function modal(title, text, okLabel, onOk){
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div role="dialog" aria-modal="true" aria-labelledby="mt"><h3 id="mt">${esc(title)}</h3><p>${esc(text)}</p><button class="btn bad" id="mok">${esc(okLabel)}</button><button class="btn ghost" id="mno">Fortryd</button></div>`;
  document.body.appendChild(m);
  m.querySelector('#mno').onclick=()=>m.remove(); m.onclick=e=>{ if(e.target===m) m.remove(); };
  m.querySelector('#mok').onclick=()=>{ m.remove(); onOk(); };
  m.querySelector('#mno').focus();
}

// ---------- reminders ----------
function nativeRem(){ try{ return JSON.parse(NATIVE.getReminder()); }catch(e){ return {time:'07:30',on:false}; } }
function nativeReminder(){ const r=nativeRem();
  return `<p>Galvo sender dig en notifikation hver dag – hvis du ikke allerede har nået dagens mål.</p>
  <div style="display:flex;gap:10px;align-items:center;margin-top:12px"><label for="nrt">Tidspunkt</label><input id="nrt" type="time" value="${esc(r.time)}"></div>
  <div style="margin-top:12px"><button class="btn ${r.on?'ghost':''}" id="nrem" data-on="${r.on?1:0}">${r.on?'Slå påmindelse fra':'Slå daglig påmindelse til'}</button></div>
  <p style="margin-top:10px;font-size:13px">${r.on?`Påmindelse er slået til kl. ${esc(r.time)}.`:'Påmindelsen er slået fra.'}</p>`; }
function gcalUrl(time){
  const [h,mi]=time.split(':').map(Number); const d=new Date(); const pad=n=>String(n).padStart(2,'0');
  const ds=`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
  const end=new Date(2000,0,1,h,mi+10);
  const p=new URLSearchParams({action:'TEMPLATE',text:'Galvo: 5 minutters service-træning',details:'Hold din streak i live – tag dagens lektion i Galvo.',
    dates:`${ds}T${pad(h)}${pad(mi)}00/${ds}T${pad(end.getHours())}${pad(end.getMinutes())}00`,recur:'RRULE:FREQ=DAILY',ctz:Intl.DateTimeFormat().resolvedOptions().timeZone||'Europe/Copenhagen'});
  return 'https://calendar.google.com/calendar/render?'+p.toString();
}
// ---------- render & events ----------
function render(){
  const v=view.name;
  $app.innerHTML = v==='home'?home():v==='practice'?practice():v==='badges'?badges():v==='profile'?profile():v==='lesson'?lessonView():v==='learn'?learnView():v==='glossary'?glossaryView():v==='blitz'?blitzView():v==='blitzres'?blitzRes():v==='case'?caseView():v==='caseres'?caseRes():result();
}
$app.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t||t.disabled) return;
  if(t.dataset.go){ if(view.name==='blitz'){ clearInterval(bTimer); } go(t.dataset.go); return; }
  if(t.dataset.learn!==undefined){ view={name:'learn',u:+t.dataset.learn,i:+(t.dataset.card||0)}; render(); window.scrollTo(0,0); return; }
  if(t.dataset.lnav!==undefined){ learnNav(+t.dataset.lnav); return; }
  if(t.dataset.case!==undefined){ startCase(+t.dataset.case); return; }
  if(t.dataset.cpick!==undefined){ K.pick=+t.dataset.cpick; render(); return; }
  if(t.id==='ccheck'){ caseCheck(); return; }
  if(t.id==='cretry'){ K.state='ask'; K.pick=null; render(); return; }
  if(t.id==='cnext'){ caseNext(); return; }
  if(t.id==='blitz'){ startBlitz(); return; }
  if(t.id==='bquit'){ endBlitz(); return; }
  if(t.dataset.bz!==undefined){ blitzAnswer(t.dataset.bz); return; }
  if(t.dataset.ml!==undefined){ L.msel=+t.dataset.ml; render(); return; }
  if(t.dataset.mr!==undefined){ if(L.msel===null){ toast('Vælg først et punkt til venstre'); return; } const j=+t.dataset.mr; Object.keys(L.mp).forEach(k=>{ if(L.mp[k]===j) delete L.mp[k]; }); L.mp[L.msel]=j; const nxt=L.cur.p.findIndex((_,i)=>L.mp[i]===undefined); L.msel = nxt>=0?nxt:null; render(); return; }
  if(t.dataset.start!==undefined){ startLesson(t.dataset.boss==='1'?'boss':'unit', +t.dataset.start, +t.dataset.j); return; }
  if(t.dataset.mode){ startLesson(t.dataset.mode); return; }
  if(t.dataset.goal){ S.goal=+t.dataset.goal; save(); render(); toast('Dagligt mål: '+S.goal+' XP'); return; }
  if(t.dataset.pick!==undefined){ L.pick=+t.dataset.pick; render(); return; }
  if(t.dataset.tf!==undefined){ L.pick=t.dataset.tf==='true'; render(); return; }
  if(t.dataset.order!==undefined){ L.order.push(+t.dataset.order); render(); return; }
  if(t.dataset.unorder!==undefined){ L.order.splice(+t.dataset.unorder,1); render(); return; }
  if(t.id==='galvo'){ gLine=(gLine+1+Math.floor(Math.random()*(GALVO_LINES.length-1)))%GALVO_LINES.length; const say_=document.querySelector('.hero .say'); if(say_) say_.textContent=GALVO_LINES[gLine]; const g=t.querySelector('.g'); if(g){ g.classList.remove('jump'); void g.offsetWidth; g.classList.add('jump'); } sfx('tap'); return; }
  if(t.id==='snd'){ S.sound = S.sound===false; save(); render(); if(S.sound) sfx('ok'); return; }
  if(t.id==='check'){ check(); return; }
  if(t.id==='cont'){ cont(); return; }
  if(t.id==='quit'){ modal('Afslut lektionen?','Du mister fremskridtet i denne lektion. Galvo bliver lidt ked af det.','Afslut',()=>go('home')); return; }
  if(t.id==='nrem'){ const on=t.dataset.on!=='1'; const tm=(document.getElementById('nrt')||{}).value||'07:30'; try{ NATIVE.setReminder(tm,on); }catch(e){} render(); toast(on?'Påmindelse slået til kl. '+tm:'Påmindelse slået fra'); return; }
  if(t.id==='reset'){ modal('Nulstil alt?','Alle XP, streak, badges og fremskridt slettes. Det kan ikke fortrydes.','Nulstil',()=>{ S=fresh(); save(); go('home'); toast('Fremskridt nulstillet'); }); return; }
});
$app.addEventListener('input',e=>{ if(e.target.id==='gq'){ const g=document.getElementById('gl'); if(g) g.innerHTML=glossList(e.target.value); } });
$app.addEventListener('change',e=>{ if(e.target.id==='rt'){ S.remind=e.target.value||'07:30'; save(); render(); }
  if(e.target.id==='nrt'&&NATIVE){ const r=nativeRem(); try{ NATIVE.setReminder(e.target.value||'07:30', r.on); }catch(x){} render(); } });
render();
if(NATIVE){ try{ NATIVE.setQuestions(JSON.stringify(Object.values(allQ).map(q=>({id:q.id,q:(q.t==='fill'?q.s.replace('___','_____'):q.q),u:(UNITS.find(u=>u.id===q.unit)||{}).title||''})))); NATIVE.saveState(JSON.stringify(S)); }catch(e){} }
window.galvoQuestion = id => { if(allQ[id]) startLesson('single', id); };
window.galvoRefresh = () => { if(view.name!=='lesson'&&view.name!=='blitz') render(); };
window.galvoBack = () => { if(view.name==='lesson'){ document.getElementById('quit')?.click(); return true; } if(view.name==='blitz'){ endBlitz(); return true; } if(view.name!=='home'){ go('home'); return true; } return false; };
})();
</script>
</body>
</html>
